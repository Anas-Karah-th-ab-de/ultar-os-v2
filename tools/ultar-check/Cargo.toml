[package]
name = "ultar-check"
version = "0.9.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Repository quality gate for Ultar OS: area/layer rules, clean-code rules and size budgets"
publish = false

[lib]
name = "ultar_check"
path = "src/lib.rs"

[[bin]]
name = "ultar-check"
path = "src/main.rs"

[dependencies]
# the brand source the rule `brand` compares the repository with
ultar-brand = { path = "../../system/core/ultar-brand" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

