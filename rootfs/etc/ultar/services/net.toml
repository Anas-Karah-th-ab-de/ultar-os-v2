# Netzwerkdienst: DHCP / statische Adresse für Kabelnetzwerk
exec = "/usr/bin/ultar-net"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: configures addresses and routes (SIOCSIF*/SIOCADDRT), runs DHCP on port 68 and starts
#   wpa_supplicant through the compat runner; Linux allows all of it to root (CAP_NET_ADMIN,
#   CAP_NET_RAW, privileged port) only. To be split: the address/route part into a small helper
#   behind the bus, DHCP and Wi-Fi as a user.
# right net_admin: addresses, routes, interface flags
# right mount: wpa_supplicant runs through the compat runner (unshare, mounts, chroot)
rights = ["net_admin", "mount"]
restart = "always"

[cgroup]
"memory.max" = "32M"
