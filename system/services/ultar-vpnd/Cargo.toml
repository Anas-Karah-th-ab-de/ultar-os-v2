[package]
name = "ultar-vpnd"
version = "0.8.3"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "VPN of Ultar OS, served by the network service ultar-netd: WireGuard tunnels (boringtun's reviewed protocol implementation over a TUN device), imported from standard .conf files, keys kept 0600 (system services, area 4)"

[lib]
name = "ultar_vpnd"
path = "src/lib.rs"

[dependencies]
ultar-bus = { path = "../../core/ultar-bus" }
ultar-service = { path = "../../core/ultar-service" }
ultar-svckit = { path = "../../core/ultar-svckit" }
ultar-hal-netlink = { path = "../../hal/ultar-hal-netlink" }
serde = { version = "1", features = ["derive"] }
boringtun = { version = "0.7", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rustix = { version = "1", default-features = false, features = ["std", "event"] }
zeroize = "1"

[dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "thread", "fs"] }
