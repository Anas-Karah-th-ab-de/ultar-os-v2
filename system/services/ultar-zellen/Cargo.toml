[package]
name = "ultar-zellen"
version.workspace = true
edition.workspace = true
description = "Ultar-Zellen: Apps und Container abgeschottet starten (eigener Speicher, Netz/VPN mit Killswitch, Privatsphäre, Protokoll), verknüpfen, Grafikkarten verteilen, Kiri als Docker-Ersatz."

[dependencies]
ultar-sprache = { path = "../../core/ultar-sprache" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
sha2 = "0.10"
nix = { version = "0.29", features = ["mount", "sched", "fs", "hostname", "user", "process", "signal"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[lib]
name = "ultar_zellen"
path = "src/lib.rs"

[[bin]]
name = "zelle"
path = "src/bin/zelle.rs"
