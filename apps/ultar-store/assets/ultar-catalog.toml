# Ultar Store – the catalogue that ships with the system image.
# Entries and texts are exactly the twelve components of DESKTOP-SPEC §7.2 as
# the board "Store" draws them. Sizes and versions are `None` here: the board
# footnote defines them as run-time values from the real catalogue, and the
# store shows `—` until a signed catalogue (stick or image update) carries
# them. The publisher is the brand fact (docs/BRAND.md); the store's own
# package is installed through the package logic (launcher), not through
# itself.

format_version = 1
generated = "2026-11-24"

[[app]]
id = "km-office"
category = "office"
icon = "office"
publisher = "KM Code Craft"
source = "ultar"
file_types = [".docx", ".xlsx", ".pptx", ".pdf", ".odt", ".ods"]
requires = []
package = "km-office.uap"
[app.name]
ar = "الأدوات المكتبية"
en = "Office tools"
[app.summary]
ar = "مستندات وجداول وعروض وأدوات PDF."
en = "Documents, spreadsheets, slides and PDF tools."
[app.description]
ar = "مستندات وجداول وعروض وأدوات PDF، تعمل دون إنترنت وتفتح ملفات ‎.docx‏ و ‎.xlsx‏."
en = "Documents, spreadsheets, slides and PDF tools; works without internet and opens .docx and .xlsx files."
[[app.permissions]]
id = "files"
[app.permissions.reason]
ar = "يفتح فقط الملفات التي تختارها أنت"
en = "Opens only the files you choose"
[[app.permissions]]
id = "network"
[app.permissions.reason]
ar = "لا يتّصل بالإنترنت"
en = "Does not connect to the internet"
[[app.permissions]]
id = "printing"
[app.permissions.reason]
ar = "يطبع على الطابعة التي تختارها"
en = "Prints on the printer you choose"

