[package]
name = "ultar-web"
version = "0.8.2"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Ultar Browser: Rust browser core and window (tabs, address bar, downloads, site permissions, tracking protection) on the compositor; web engines behind the WebEngine trait (apps, area 7)"

[lib]
name = "ultar_web"
path = "src/lib.rs"

[[bin]]
name = "ultar-web"
path = "src/bin/ultar-web.rs"
required-features = ["tor"]

[features]
default = ["tor"]
# The browser program runs the Tor client (Arti). The library alone (used by the Servo engine
# host in external/servo-host) carries no Tor: Arti's derive_more features would otherwise leak
# into Servo's WebRender through feature unification (derive_more's PartialEq replaces the
# built-in one there and breaks constants in patterns).
tor = ["dep:ultar-tor"]

[[bin]]
name = "ultar-web-filter"
path = "src/bin/ultar-web-filter.rs"

[dependencies]
ultar-ui = { path = "../../platform/ultar-ui", default-features = false }
ultar-surface = { path = "../../platform/ultar-surface" }
ultar-i18n = { path = "../../system/core/ultar-i18n" }
ultar-brand = { path = "../../system/core/ultar-brand" }
rustix = { version = "1", default-features = false, features = ["std", "net", "fs", "event", "pipe"] }
# The reader engine (engine::reader): pages fetched in pure Rust. TLS through rustls with the
# Graviola provider where the CPU and the kernel offer AVX2, else the pure-Rust RustCrypto
# provider (the Ultar kernel does not keep AVX registers yet); Mozilla roots compiled in.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "socks-proxy"] }
rustls-graviola = "0.4"
rustls-rustcrypto = "0.0.2-alpha"
encoding_rs = "0.8"
# Sound and video of pages (media::): audio decoders in pure Rust (MP3, AAC, FLAC, Vorbis, WAV in
# MP4/M4A, Ogg, Matroska/WebM, WAV), the MP4 container in pure Rust, H.264 by OpenH264 (BSD,
# built from source and linked statically).
ultar-tor = { path = "../../platform/ultar-tor", optional = true }
ultar-hal-system = { path = "../../system/hal/ultar-hal-system" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "mkv"] }
mp4 = "0.14"
openh264 = { version = "0.9", default-features = false, features = ["source"] }

[dev-dependencies]
ultar-ui = { path = "../../platform/ultar-ui" }
