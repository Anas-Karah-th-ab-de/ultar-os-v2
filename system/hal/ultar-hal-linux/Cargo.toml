[package]
name = "ultar-hal-linux"
version = "0.8.1"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Generic kernel backends of the HAL for the system services: power supplies and sleep, sound mixers, removable drives, radios (area 3, HAL)"

[dependencies]
ultar-hal = { path = "../ultar-hal" }
rustix = { version = "1", default-features = false, features = ["std", "fs", "mount", "net", "event"] }
