[package]
name = "ultar-wm"
version = "0.7.0"
edition = "2021"
license = "Proprietary AND MIT"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Ultar Fenstersystem – Wayland-Compositor (Desktop- und Tablet-Modus), Basis: Smithay/Anvil (MIT)"

# Eigenes Workspace: läuft im Ubuntu-Bereich (/compat) und nutzt dort Mesa (GPU), libinput, libseat.
[workspace]

[[bin]]
name = "ultar-wm"
path = "src/main.rs"

[dependencies]
bitflags = "2.2.1"
image = { version = "0.25.1", default-features = false, features = ["png"] }
rand = "0.8"
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
thiserror = "1"
xcursor = { version = "0.3.3", optional = true }
xkbcommon = "0.8.0"
profiling = "1.0"
drm = { version = "0.14.0", optional = true }
x11rb = { version = "0.13.0", default-features = false, features = ["composite"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
cosmic-text = "0.19"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["desktop", "wayland_frontend"]

[features]
default = ["egl", "winit", "x11", "udev", "fb", "xwayland"]
# Bildspeicher-Weg ohne DRM (fbdev, Samsung DECON) mit Pixman
fb = ["udev"]
egl = ["smithay/use_system_lib", "smithay/backend_egl"]
udev = [
  "drm",
  "smithay/backend_libinput",
  "smithay/backend_udev",
  "smithay/backend_drm",
  "smithay/backend_gbm",
  "smithay/backend_vulkan",
  "smithay/backend_egl",
  "smithay/backend_session_libseat",
  "smithay/renderer_gl",
  "smithay/renderer_pixman",
  "smithay/renderer_multi",
  "xcursor",
]
winit = ["smithay/backend_winit", "smithay/backend_drm"]
x11 = ["smithay/backend_x11", "x11rb", "smithay/renderer_gl", "smithay/backend_vulkan"]
xwayland = ["smithay/xwayland", "x11rb", "smithay/x11rb_event_source", "xcursor"]
renderer_sync = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
