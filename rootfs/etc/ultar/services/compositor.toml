# Native compositor (ultar-compositor): shows the windows of app processes
# (ultar-surface protocol). In the ordinary system it is started by hand until
# the surface (ultar-shell) moves onto it - both would drive the display:
# ultar-ctl start compositor. On the installation medium (profile installer)
# it starts with the system and shows the installer.
editions = ["phone", "desktop"]
exec = "/usr/bin/ultar-compositor"
args = [
    "--socket", "/run/ultar/ui/compositor.sock",
    "--rights", "/etc/ultar/compositor-rights.toml",
    # Only input nodes of the seat group (812, set by ultar-devd-seat) are
    # opened; on a kernel that gates device nodes by rights instead of owners
    # the state file says so and the group check is dropped (missing or
    # other: the check stays, fail closed).
    "--seat-group", "812",
    "--seat-state", "/run/ultar/seat/modes",
    # Bluetooth keyboards and mice: the uinput devices made by ultar-btd (827), named
    # by the kernel (review S-4: no other software device joins the seat).
    "--allow-virtual-owner", "827",
    # ui.* permissions of apps: every app has its own user id (20000-49999,
    # ultar-launcher), so per-uid limits are per app; the launcher writes
    # their granted rights here (owner 805, not writable by others).
    "--app-rights", "/run/ultar/launcher/compositor-apps.toml",
    "--app-uids", "20000-49999",
    "--app-rights-owner", "805",
    # The desktop session starts locked in the ordinary system (boot profile from
    # ultar-init, ULTAR_PROFILE): nothing but the lock screen is drawn or gets input
    # before the first unlock. Not on the installation medium (profile installer),
    # which has no lock screen and no account yet.
    "--start-locked-in", "system",
]
# The seat's nodes are set before the compositor opens them.
after = ["seat"]
# Identity and rights: its own user (811). Clients are told apart by their
# kernel user ids (SO_PEERCRED); the rights table names user ids and refuses
# root, so no client gets ui.* rights by running as root.
# right raw_device: the display (DRM/KMS or fb0) and the input devices
# Group seat (812): the seat's device nodes are root:seat 0660 (Linux).
user = 811
groups = [812]
public_dirs = ["/run/ultar/ui"]
rights = ["raw_device"]
notify = true
restart = "on-failure"

[profiles]
system = "manual"
installer = "start"

[cgroup]
"pids.max" = "16"
"cpu.weight" = "200"
