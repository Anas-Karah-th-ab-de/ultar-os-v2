id          = "settings"
version     = "0.7.1"
publisher   = "km-code-craft"
kind        = "native"
min_os      = "2.0"
category    = "system"
name        = "app.settings.name"
description = "app.settings.desc"
icon        = "gear"

[form]
factors     = ["phone", "tablet", "laptop", "desktop"]
modes       = ["mobile", "desktop"]

[needs]
required    = []
optional    = ["display", "external_display"]

[permissions]
# The services its pages use; the bus policy (rule app.settings) grants exactly the methods
# and topics of each page, administrator actions are confirmed in the system dialog.
# settings.*: read and change settings, confirm/revert (DESKTOP-SPEC §8).
# devices.*: driver list, switch, rollback, rescan (panel "Drivers and hardware").
# display.*: display names/modes, show numbers, look for displays.
# update.*: firmware updates on the drivers page.
# account.*: the Ultar account page (§12.1) and the users.
# net.*, vpn.*, bluetooth.*, audio.*, power.*: the Network, Bluetooth, Sound pages and the energy state.
# launcher.*: the Apps page (installed apps, their permissions, taking one back).
# volumes.*: how full the storage and the mounted drives are (Storage page).
bus         = ["settings.*", "devices.*", "display.*", "update.*", "account.*", "net.*", "vpn.*", "bluetooth.*", "audio.*", "power.*", "launcher.*", "volumes.*"]
files       = ["documents"]
