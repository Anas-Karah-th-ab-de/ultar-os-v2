[package]
name = "ultar-foreign"
version = "0.8.1"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Service for apps from other systems (Linux, later Windows and Android): checks files, asks the administrator, installs into the Linux area in a cell and registers the programs as app.foreign apps (system services, area 4)"

[lib]
name = "ultar_foreign"
path = "src/lib.rs"

[[bin]]
name = "ultar-foreign"
path = "src/bin/ultar-foreign.rs"

[dependencies]
ultar-bus = { path = "../../core/ultar-bus" }
ultar-service = { path = "../../core/ultar-service" }
ultar-svckit = { path = "../../core/ultar-svckit" }
ultar-sys = { path = "../../hal/ultar-sys" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rustix = { version = "1", default-features = false, features = ["std", "thread", "process", "mount", "fs"] }
# Android apps (src/apk): ZIP inflate, APK Signature Scheme v2/v3 (RSA, ECDSA P-256/P-384)
miniz_oxide = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "std"] }

[dev-dependencies]
ultar-svckit = { path = "../../core/ultar-svckit", features = ["testkit"] }
