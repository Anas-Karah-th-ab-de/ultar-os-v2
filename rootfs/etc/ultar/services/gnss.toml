# Nur Handy-Ausgabe (Samsung-Hardware)
editions = ["phone"]
# GPS (Samsung A30): Samsungs gpsd + GNSS-Dienst in der Android-Umgebung unter /data/android,
# Ausgabe /run/ultar/gnss.nmea für die Oberfläche (Einstellungen -> Standort). GNSS ist nur an,
# solange die Oberfläche /run/ultar/gnss.want berührt. Siehe docs/A30-GNSS.md.
exec = "/system/bin/sh"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: starts the vendor GNSS HAL (Android binaries, phone only): chroot into the Android tree,
#   bind mount of gps.cfg, chmod of /dev/gnss_ipc; the vendor daemons expect root.
# right mount: chroot and bind mounts of the Android tree
# right file_admin: chmod of /dev/gnss_ipc, files of the Android tree owned by other ids
rights = ["mount", "file_admin"]
args = ["/data/android/gnss-dienst.sh"]
after = ["drivers"]
