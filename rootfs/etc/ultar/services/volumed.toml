# Removable-drive service (docs/integration/system-services.md): mounts FAT,
# exFAT and ext4 partitions of removable disks for the person in front below
# /run/ultar/media/<name>/<label> (nosuid,nodev,noexec; FAT files belong to
# that person only), ejects them for the shell's drive tile, detaches pulled
# drives. Reads partition heads from /dev (disk group 832). Follows the Storage
# page settings: low-space warning, automount off offers a "Mount" button. The
# daily clean-up of the person's downloads folder is the launcher's (it owns the
# areas; this service handles untrusted USB file systems and must not reach them).
editions = ["phone", "desktop"]
exec = "/usr/bin/ultar-volumed"
args = [
    "--bus", "/run/ultar/bus/volumed.sock",
    "--media", "/run/ultar/media",
    "--log-socket", "/run/ultar/log/volumed.sock",
]
user = 828
groups = [832]
public_dirs = ["/run/ultar/media"]
# right mount: mounting and unmounting the drives; nothing else needs it.
rights = ["mount"]
notify = true
after = ["bus"]
restart = "always"

[cgroup]
"memory.max" = "16M"
"pids.max" = "16"
"cpu.weight" = "50"
