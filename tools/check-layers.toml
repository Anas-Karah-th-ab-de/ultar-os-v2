# Area and dependency rules for `ultar-check layers` (plan §3.0 and §7 rule 0/1).
#
# Every crate must live below exactly one area prefix. A path dependency is
# allowed when
#   * both crates are in the same area and that area has `internal = true`, or
#   * an [[allow]] entry matches (from area, to area and, if `crates` is given,
#     the target crate directory equals or lies below one of the listed paths).
# Everything else fails. `rank` is only used to tell "upward" dependencies
# (lower layer depends on a higher one) apart from other forbidden ones.
# Areas with `unrestricted = true` may depend on anything (developer tooling).

# Path prefixes that are not checked at all (repository relative).
# server/ is the cloud side (own x86 workspace), not part of the device system.
exclude = ["server/"]

[[area]]
name = "kernel"
prefix = "kernel/"
rank = 1
internal = true

[[area]]
name = "drivers"
prefix = "drivers/"
rank = 2
internal = true

[[area]]
name = "system-core"
prefix = "system/core/"
rank = 3
internal = true

[[area]]
name = "system-hal"
prefix = "system/hal/"
rank = 4
internal = false

[[area]]
name = "system-services"
prefix = "system/services/"
rank = 5
internal = false

[[area]]
name = "platform"
prefix = "platform/"
rank = 6
internal = true

[[area]]
name = "apps"
prefix = "apps/"
rank = 7
internal = false

[[area]]
name = "external"
prefix = "external/"
rank = 8
internal = false

[[area]]
name = "tools"
prefix = "tools/"
rank = 100
unrestricted = true

# kernel -> nothing from the repository except kernel drivers
[[allow]]
from = "kernel"
to = "drivers"
crates = ["drivers/kernel"]

# kernel (kernel, UEFI loader) -> the A/B boot contract shared with the updater: slot table,
# partition layout, load options, GPT reader (no_std, pure; one source for both sides);
# and the brand source (names, brand mark, brand texts; no_std, no dependencies)
[[allow]]
from = "kernel"
to = "system-core"
crates = ["system/core/ultar-slots", "system/core/ultar-brand"]

# drivers -> driver package format only
[[allow]]
from = "drivers"
to = "system-core"
crates = ["system/core/ultar-driverpkg"]

# HAL backends -> HAL traits + system core
[[allow]]
from = "system-hal"
to = "system-hal"
crates = ["system/hal/ultar-hal"]

[[allow]]
from = "system-hal"
to = "system-core"

# Area 3 is system core + HAL together: the core may use the HAL traits and the
# system source of the device profile, never a device backend.
[[allow]]
from = "system-core"
to = "system-hal"
# ultar-sys: the system calls std does not offer, for the service runtime.
crates = ["system/hal/ultar-hal", "system/hal/ultar-hal-system", "system/hal/ultar-sys"]

# services -> system core + HAL traits
[[allow]]
from = "system-services"
to = "system-core"

# ultar-hal-linux: the generic kernel backends of the system services (power
# supplies and sleep, sound-card controls, radio switches, network links,
# removable drives; docs/integration/system-services.md). Device paths and
# unsafe stay in the HAL crate, every backend takes a root directory.
# ultar-hal-netlink: netlink (nl80211, rtnetlink), TUN and the DHCP socket of
# the network service (Wi-Fi, DHCP, VPN).
[[allow]]
from = "system-services"
to = "system-hal"
crates = ["system/hal/ultar-hal", "system/hal/ultar-hal-system", "system/hal/ultar-hal-linux", "system/hal/ultar-hal-netlink"]

# ultar-vpnd: the VPN (library) runs inside the network service's process –
# busd and logd were at the kernel's 16 supplementary groups when it was split off (32 now).
[[allow]]
from = "system-services"
to = "system-services"
crates = ["system/services/ultar-vpnd"]

# ultar-screend (remote view): reads the screen like the screenshot service, through the
# compositor's client library (compositor right ui.capture for its own user only); its
# end-to-end tests run the real headless compositor and two mesh nodes (dev-dependencies).
[[allow]]
from = "system-services"
to = "platform"
crates = ["platform/ultar-surface", "platform/ultar-compositor"]

[[allow]]
from = "system-services"
to = "system-services"
crates = ["system/services/ultar-mesh"]

# ultar-cloud: the device client of the account server (library, no process of its own:
# device key, signed registration and sessions). The account service signs in with it.
[[allow]]
from = "system-services"
to = "system-services"
crates = ["system/services/ultar-cloud"]

# platform -> system core + HAL traits
[[allow]]
from = "platform"
to = "system-core"

# ultar-hal-gfx: the compositor owns the display and input devices and the
# shared pixel memory of app windows (plan §3.6); its client library needs
# the same shared memory. Device paths and unsafe stay in the HAL crate.
[[allow]]
from = "platform"
to = "system-hal"
crates = ["system/hal/ultar-hal", "system/hal/ultar-hal-system", "system/hal/ultar-hal-gfx"]

# apps -> public app API + bus/i18n/profile
# platform/ultar-surface: the compositor client (window, input, clipboard). Allowed for apps by
# the lead's layering decision (wave 7): there is no separate app-api crate yet, and every app
# window is an ultar-surface client. Apps use only its client side (UiWindow, Client).
# compositor client API for app windows: the browser window (apps/ultar-web), the files and
# phone apps are such clients.
[[allow]]
from = "apps"
to = "platform"
crates = ["platform/app-api", "platform/ultar-ui", "platform/ultar-surface", "platform/ultar-textview", "platform/ultar-tor"]

[[allow]]
from = "apps"
to = "system-core"
crates = ["system/core/ultar-bus", "system/core/ultar-i18n", "system/core/ultar-profile", "system/core/ultar-brand"]

# The Store and the shell's overview search share one catalogue data model, parser and
# signature check (system/core/ultar-catalog); the shell may not depend on the apps area,
# so the catalogue lives in system/core and both use it (docs/integration/settings-wiring.md).
[[allow]]
from = "apps"
to = "system-core"
crates = ["system/core/ultar-catalog"]

# App-Builder packs and signs the developer's own packages with the package format library
# (no own crypto in the app, APP-RULES §5); nothing else of ultar-pkg is used by apps.
[[allow]]
from = "apps"
to = "system-core"
crates = ["system/core/ultar-pkg"]

# The browser plays the sound of pages through the sound card: the node's path from the HAL.
[[allow]]
from = "apps"
to = "system-hal"
crates = ["system/hal/ultar-hal-system"]

# The office library (text buffer with encodings and undo, documents, sheets, PDF) is shared by
# the editor and the office apps; it has no window and no process of its own.
[[allow]]
from = "apps"
to = "apps"
crates = ["apps/ultar-office"]

# third-party packages use the same API as system apps
[[allow]]
from = "external"
to = "platform"
crates = ["platform/app-api", "platform/ultar-ui"]

[[allow]]
from = "external"
to = "system-core"
crates = ["system/core/ultar-bus", "system/core/ultar-i18n", "system/core/ultar-profile", "system/core/ultar-brand"]

# the browser's Servo engine host (external/servo-host, its own process of the browser) speaks the
# browser's protocol and uses its persona: one definition, in the browser's library
[[allow]]
from = "external"
to = "apps"
crates = ["apps/ultar-web"]

# App-Builder packs and signs the developer's own packages with the package format library
# (no own crypto in the app, APP-RULES §5); nothing else of ultar-pkg is used by apps.
[[allow]]
from = "apps"
to = "system-core"
crates = ["system/core/ultar-pkg"]
