# Ultar-Verbund: Geräte (Handy, Laptop, Server, Platine) im Netz finden, koppeln, steuern, Leistung bündeln.
# Der Dienst läuft immer, tut aber nichts, solange der Nutzer den Verbund nicht einschaltet
# (Einstellungen → Verbund, `ultar-verbund an`, oder /proc/ultar/verbund auf dem Ultar-Kern).
exec = "/usr/bin/ultar-verbund"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: exchanges screen and files with the surface through /run/ultar (shell.fern,
#   bildschirm.raw), which the surface creates as root without group access, and writes received
#   files to /data/Empfangen. It needs no kernel right; it can run as its own user once the
#   surface creates those for a group.
# No kernel right.
args = ["dienst"]
restart = "always"
after = ["net"]

[env]
ULTAR_VERBUND_DIR = "/data/ultar/verbund"
ULTAR_VERBUND_LOG = "1"

[cgroup]
"pids.max" = "512"
