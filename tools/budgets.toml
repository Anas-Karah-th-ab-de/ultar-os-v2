# Size budgets for release binaries, checked by `ultar-check budget`
# (binary name -> maximum size in bytes). Binaries that are not built are skipped.
[binaries]
ultar-stage0 = 1_500_000
ultar-init = 2_500_000
ultar-devd = 3_000_000
ultar-ctl = 2_000_000
ultar-settingsd = 3_000_000
ultar-pkg = 4_000_000
ultar-update = 4_000_000
ultar-check = 4_000_000
