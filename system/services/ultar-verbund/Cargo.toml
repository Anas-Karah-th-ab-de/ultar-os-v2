[package]
name = "ultar-verbund"
version.workspace = true
edition.workspace = true
description = "Ultar-Verbund: Ultar-Geräte (Handy, Server, Laptop, Platine) koppeln, gegenseitig steuern und Rechenleistung bündeln – im eigenen Netz direkt, sonst Ende-zu-Ende verschlüsselt über ultar.code-craft.tech."

[dependencies]
ultar-sprache = { path = "../../core/ultar-sprache" }
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tungstenite = { version = "0.23", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[lib]
name = "ultar_verbund"
path = "src/lib.rs"

[[bin]]
name = "ultar-verbund"
path = "src/bin/ultar-verbund.rs"
