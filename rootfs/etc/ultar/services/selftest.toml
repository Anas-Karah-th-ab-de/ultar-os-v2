# Selbsttest beim Booten (nur Entwicklungs-Image)
exec = "/usr/lib/ultar/selftest.sh"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: manual test (kernel parameter ultar.start=...): stops services over the root-only
#   control socket, runs dpkg and programs inside the compat tree, powers off.
# right mount: the compat runner (unshare, mounts, chroot)
rights = ["mount"]
oneshot = true
manual = true
console = true
after = ["heartbeat"]
