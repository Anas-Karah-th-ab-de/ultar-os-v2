# The helper (docs/integration/ultar-agentd.md): takes one request in the person's words
# and acts through the bus. It thinks with the device's own language model, with one a
# paired device lends, or – without either – understands only a few fixed requests.
exec = "/usr/bin/ultar-agentd"
args = [
    "--bus", "/run/ultar/bus/agentd.sock",
    "--state", "/data/ultar/agentd",
    "--log-socket", "/run/ultar/log/agentd.sock",
]
# Its own user (834) without kernel rights. Its one file: the list of what it did, for
# the person to read in Settings.
user = 834
dirs = ["/data/ultar/agentd"]
notify = true
after = ["bus"]
restart = "always"

[cgroup]
"memory.max" = "24M"
"pids.max" = "16"
"cpu.weight" = "50"
