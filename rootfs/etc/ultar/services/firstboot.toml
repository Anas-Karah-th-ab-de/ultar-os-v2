# First start of an installed system: the installer's answers record
# (ULTAR-BOOTCTL, written by ultar-installer-ui) becomes the first account of
# the authentication service (/data/ultar/auth/users, owner authd 813); the
# other choices (language, keyboard, time zone, accessibility, device name)
# become values in the settings service's store (/data/ultar/settings, adopted
# by settingsd when it starts) and edition + components the selection record
# /data/ultar/install/selection.toml for the Store. Then the record is wiped.
# Every later start finds no record and ends at once. authd and settingsd start
# after it (installation image, tools/vm/make-vmware.sh).
exec = "/usr/bin/ultar-firstboot"
args = [
    "--bootctl", "/dev/ultar/part/ULTAR-BOOTCTL",
    "--auth-dir", "/data/ultar/auth", "--owner", "813",
    "--settings-dir", "/data/ultar/settings",
    "--install-dir", "/data/ultar/install",
]
oneshot = true
console = true
# Identity and rights:
# root: the raw A/B nodes (ULTAR-BOOTCTL) open for root only.
# right raw_device: the answers record in ULTAR-BOOTCTL, read and wiped.
# right file_admin: the account file's owner (authd, 813); the settings store
# may already belong to settingsd (803) after an interrupted first start.
rights = ["raw_device", "file_admin"]
dirs = ["/data/ultar/auth"]

[cgroup]
"memory.max" = "32M"
"pids.max" = "4"
