[package]
name = "ultar-sheet"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ultar OS spreadsheet: .xlsx and .csv in Arabic and English, formulas, formats, right-to-left sheets (area 6, apps)"

[lib]
name = "ultar_sheet"
path = "src/lib.rs"

[[bin]]
name = "ultar-sheet"
path = "src/bin/ultar-sheet.rs"

[dependencies]
ultar-ui = { path = "../../platform/ultar-ui", default-features = false }
ultar-surface = { path = "../../platform/ultar-surface" }
ultar-bus = { path = "../../system/core/ultar-bus" }
ultar-i18n = { path = "../../system/core/ultar-i18n" }
# The spreadsheet library: cells, formulas, recalculation, .xlsx and .csv.
ultar-office = { path = "../ultar-office" }

[dev-dependencies]
ultar-ui = { path = "../../platform/ultar-ui" }
