# Ultar OS – the system's users and groups (fixed ids). Service files name
# them by number (`user`, `group`, `groups`); every number they use must be
# listed here (ultar-init's shipped-file test). scripts/build-initramfs.sh
# writes /etc/passwd and /etc/group from this file.
#
# [users]: name = id; each user has its own group of the same name and id.
# [groups]: groups that are nobody's own group: name = id.
# [members]: supplementary members of a group (user names).
# [ranges]: ids given out at run time, never listed one by one.

[users]
root = 0
busd = 801
logd = 802
settingsd = 803
devd = 804
launcher = 805
llm = 810
compositor = 811
# Authentication (hashed passwords and PINs), lock screen, system dialogs and the
# desktop shell (docs/integration/desktop-shell.md): one user each.
authd = 813
lock = 814
sysdialog = 815
desktop = 816
# Display service and account service (docs/integration/display-account-services.md).
displayd = 817
accountd = 818
powerd = 819
sessiond = 820
notifyd = 821
calendard = 822
audiod = 823
mediad = 824
captured = 825
netd = 826
btd = 827
volumed = 828
# Call service (phone; docs/integration/ultar-phone.md).
calld = 829
# The graphical installer (profile `installer`, installation medium only): the Ultar kernel opens
# the whole-disk nodes /dev/ultar/disk/* and /dev/ultar/medium only for this user or group (rawpart.rs).
# Device mesh, helper and the language model's bus face (docs/integration/ultar-mesh.md,
# ultar-agentd.md, ultar-llm-bus.md): one user each.
mesh = 833
agentd = 834
llmbus = 835
# The cloud model, the helper's last way to think (docs/integration/ultar-llm-cloud.md).
llmcloud = 837
# The on-screen keyboard (ultar-osk): compositor right ui.input-method only.
osk = 839
installer = 840
# Remote view source (ultar-screend): looks at the screen for the mesh and types what the viewer types.
screend = 843
nobody = 65534

[groups]
# The seat's device nodes (input events, display): root:seat 0660, set by
# ultar-devd-seat (rootfs/etc/ultar/devd-seat.toml).
seat = 812
# The sound cards' control devices (root:audio 0660); member: the audio service.
audio = 830
# The radio switches (dev/rfkill, root:radio 0660); members: network and Bluetooth services.
radio = 831
# Block devices of removable disks (read-only use: partition heads); member: volumed.
disk = 832
# The user's file areas (/data/ultar/areas/*, 0770 launcher:userfiles): system apps that
# declare file areas get this group in their cell (ultar-launcher areas.rs); the launcher
# cleans the person's downloads folder (storage.clean_downloads); the desktop shell reads
# the area `desktop` (its items on the background). The volume service does
# not have it: it handles untrusted USB file systems and must not reach the areas.
userfiles = 836
# The relay token of the Ultar account (/data/ultar/account-relay, 0750/0640 accountd:accountrelay):
# written by the account service after sign-in, read by the mesh service for the Verbund relay.
accountrelay = 838
# The update service runs as root (raw A/B partitions), but root without file_admin passes no
# permission check on the Ultar kernel: its bus and log sockets are open to this group.
updated = 841

[members]
busd = ["logd"]
logd = ["busd"]
settingsd = ["busd", "logd"]
devd = ["busd", "logd"]
calld = ["busd"]
seat = ["compositor"]
# The launcher's sockets at the bus and the log service are open to its group.
launcher = ["busd", "logd"]
# The authentication service's sockets at the bus and the log service.
authd = ["busd", "logd"]
lock = ["busd"]
sysdialog = ["busd"]
desktop = ["busd"]
audio = ["audiod"]
radio = ["netd", "btd"]
disk = ["volumed"]
userfiles = ["launcher", "desktop"]
# Their sockets at the bus and the log service are open to their own groups.
displayd = ["busd", "logd"]
accountd = ["busd", "logd"]
powerd = ["busd", "logd"]
sessiond = ["busd", "logd"]
notifyd = ["busd", "logd"]
calendard = ["busd", "logd"]
audiod = ["busd", "logd"]
mediad = ["busd", "logd"]
captured = ["busd", "logd"]
netd = ["busd", "logd"]
btd = ["busd", "logd"]
volumed = ["busd", "logd"]
mesh = ["busd", "logd"]
screend = ["busd", "logd"]
accountrelay = ["accountd", "mesh"]
agentd = ["busd", "logd"]
llmbus = ["busd", "logd"]
llmcloud = ["busd", "logd"]
osk = ["busd"]
updated = ["busd", "logd"]

[ranges]
# User (and group) ids of apps: one per app, given by ultar-launcher at
# installation and kept for ever (rootfs/etc/ultar/launcher.toml uid_first,
# uid_last). No fixed id above may lie in it.
apps = "20000-49999"
# User (and group) ids of people: given by ultar-accountd (--uids), kept for
# ever once a removed user's files were kept. No fixed id above may lie in it.
people = "1000-19999"
