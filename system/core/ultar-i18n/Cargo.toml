[package]
name = "ultar-i18n"
version = "0.8.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "The one translation and locale system of Ultar OS (Arabic first, then English and German)"


[features]
default = ["std"]
std = []

[lib]
name = "ultar_i18n"
path = "src/lib.rs"

[[bin]]
name = "ultar-i18n-check"
path = "src/bin/ultar-i18n-check.rs"
required-features = ["std"]

[dependencies]
# the brand texts (`brand.*`) and the names every catalog serves: one source for all programs
ultar-brand = { path = "../ultar-brand" }
