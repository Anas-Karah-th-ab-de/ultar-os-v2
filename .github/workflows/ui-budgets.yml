# Ultar OS – frame budgets of the UI toolkit (docs/PLAN.md §3.6: 8 ms PC incl. 4K, 16 ms
# phone), enforced on every change of ultar-ui, the design tokens or this workflow.
#
# Shared GitHub runners are too noisy for single frames: here the MEDIAN of every
# measurement is asserted against the budget (ULTAR_PERF_STAT=median). The 99th percentile –
# the figure of the plan – is asserted by the same tests without the variable, on a quiet
# machine before a release (docs/integration/ultar-ui.md, "Frame budgets").
name: UI frame budgets

on:
  push:
    branches: [main]
    paths: [platform/ultar-ui/**, design/tokens.toml, assets/fonts/**, .github/workflows/ui-budgets.yml]
  pull_request:
    branches: [main]
    paths: [platform/ultar-ui/**, design/tokens.toml, assets/fonts/**, .github/workflows/ui-budgets.yml]

permissions:
  contents: read

concurrency:
  group: ui-budgets-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ULTAR_TOKENS: ${{ github.workspace }}/design/tokens.toml
  ULTAR_PERF_STAT: median

jobs:
  budgets:
    name: Frame budgets (release, median)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ui-budgets-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ui-budgets-${{ runner.os }}-

      - name: Frame budgets
        run: cargo test --release -p ultar-ui --test r3_perf --test w4_backdrop -- --include-ignored --test-threads=1 --nocapture

  ab:
    # A/B benchmark against the toolkit before the backdrop rework (tools/ui-bench/ab.sh):
    # once with the workspace release profile, once with 16 codegen units, no LTO and
    # opt-level 3 everywhere – the build in which helpers that only run fast when inlined
    # across units show up (review round 6).
    name: A/B benchmark (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: workspace
            units: ""
          - profile: 16 codegen units
            units: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: A/B benchmark against a5eb384
        env:
          AB_WORK: ${{ runner.temp }}/ab
        run: |
          if [ -n "${{ matrix.units }}" ]; then
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=${{ matrix.units }}
            export CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_OPT_LEVEL=3
          fi
          sh tools/ui-bench/ab.sh a5eb384 3
