[package]
name = "ultar-phone"
version = "0.8.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Phone app of Ultar OS (area apps): dial pad, call history, incoming call and in-call surfaces on ultar-ui, driven by the call service over the bus (DESKTOP-SPEC §12.2)."

[lib]
name = "ultar_phone"
path = "src/lib.rs"

[dependencies]
ultar-ui = { path = "../../platform/ultar-ui", default-features = false }
ultar-bus = { path = "../../system/core/ultar-bus" }
ultar-i18n = { path = "../../system/core/ultar-i18n" }
ultar-surface = { path = "../../platform/ultar-surface" }
zune-jpeg = "0.5"

[dev-dependencies]
jpeg-encoder = "0.6"
ultar-ui = { path = "../../platform/ultar-ui" }
