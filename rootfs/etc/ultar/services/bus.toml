# Bus broker (review block B). One socket per identity: who can reach a socket
# file is that identity, the policy file says what the identity may do
# (default deny). Runs as its own user (801) without kernel rights; each
# service's socket is open to that service's group only (mode 0660, busd is
# a member of those groups), the administrator's and init's to root only.
# Apps get their sockets from the cell manager, not from here.
#
# On a kernel with SO_PEERCRED the per-service sockets can be replaced by
#   "--listen-cred", "/run/ultar/bus/system.sock", "--mode", "0666",
#   "--uid-map", "/etc/ultar/uid-map.toml"
#
# Each socket has its own connection bound (--max-connections): an admitted
# connection costs one descriptor and two threads, one in the handshake one
# descriptor. The broker refuses to start when the sum does not fit its
# limits (1024 descriptors, 1024 threads); pids.max below covers the sum
# with room (checked by service_files_tests.rs).
#
# SIGTERM: clients are told, the socket files are removed, exit code 0.
# SIGHUP: the policy file is read again.
exec = "/usr/bin/ultar-busd"
args = [
    "--listen", "/run/ultar/bus/logd.sock=system.logd", "--mode", "0660", "--group", "802", "--max-connections", "8",
    "--listen", "/run/ultar/bus/settingsd.sock=system.settingsd", "--mode", "0660", "--group", "803", "--max-connections", "8",
    "--listen", "/run/ultar/bus/devd.sock=system.devd", "--mode", "0660", "--group", "804", "--max-connections", "8",
    # The app launcher (805).
    "--listen", "/run/ultar/bus/launcher.sock=system.launcher", "--mode", "0660", "--group", "805", "--max-connections", "4",
    # Authentication, lock screen, system dialogs, desktop shell (813-816).
    "--listen", "/run/ultar/bus/authd.sock=system.authd", "--mode", "0660", "--group", "813", "--max-connections", "4",
    "--listen", "/run/ultar/bus/lock.sock=system.lock", "--mode", "0660", "--group", "814", "--max-connections", "2",
    "--listen", "/run/ultar/bus/sysdialog.sock=system.sysdialog", "--mode", "0660", "--group", "815", "--max-connections", "2",
    "--listen", "/run/ultar/bus/osk.sock=system.osk", "--mode", "0660", "--group", "839", "--max-connections", "2",
    "--listen", "/run/ultar/bus/desktop.sock=system.shell", "--mode", "0660", "--group", "816", "--max-connections", "4",
    "--listen", "/run/ultar/bus/displayd.sock=system.displayd", "--mode", "0660", "--group", "817", "--max-connections", "4",
    "--listen", "/run/ultar/bus/accountd.sock=system.accountd", "--mode", "0660", "--group", "818", "--max-connections", "4",
    "--listen", "/run/ultar/bus/powerd.sock=system.powerd", "--mode", "0660", "--group", "819", "--max-connections", "4",
    "--listen", "/run/ultar/bus/sessiond.sock=system.sessiond", "--mode", "0660", "--group", "820", "--max-connections", "4",
    "--listen", "/run/ultar/bus/notifyd.sock=system.notifyd", "--mode", "0660", "--group", "821", "--max-connections", "4",
    "--listen", "/run/ultar/bus/calendard.sock=system.calendard", "--mode", "0660", "--group", "822", "--max-connections", "4",
    "--listen", "/run/ultar/bus/audiod.sock=system.audiod", "--mode", "0660", "--group", "823", "--max-connections", "4",
    "--listen", "/run/ultar/bus/mediad.sock=system.mediad", "--mode", "0660", "--group", "824", "--max-connections", "4",
    "--listen", "/run/ultar/bus/captured.sock=system.captured", "--mode", "0660", "--group", "825", "--max-connections", "4",
    "--listen", "/run/ultar/bus/netd.sock=system.netd", "--mode", "0660", "--group", "826", "--max-connections", "4",
    "--listen", "/run/ultar/bus/btd.sock=system.btd", "--mode", "0660", "--group", "827", "--max-connections", "4",
    "--listen", "/run/ultar/bus/volumed.sock=system.volumed", "--mode", "0660", "--group", "828", "--max-connections", "4",
    # Device mesh (833), helper (834), the language model's bus face (835).
    "--listen", "/run/ultar/bus/mesh.sock=system.mesh", "--mode", "0660", "--group", "833", "--max-connections", "4",
    "--listen", "/run/ultar/bus/agentd.sock=system.agentd", "--mode", "0660", "--group", "834", "--max-connections", "4",
    "--listen", "/run/ultar/bus/llmbus.sock=system.llmbus", "--mode", "0660", "--group", "835", "--max-connections", "2",
    "--listen", "/run/ultar/bus/llmcloud.sock=system.llmcloud", "--mode", "0660", "--group", "837", "--max-connections", "2",
    # Call service (829) and the modem service (ril, root on the phone).
    "--listen", "/run/ultar/bus/calld.sock=system.calld", "--mode", "0660", "--group", "829", "--max-connections", "4",
    "--listen", "/run/ultar/bus/ril.sock=system.ril", "--mode", "0600", "--max-connections", "2",
    # The update service (root: it writes the slots and the boot control; group 841, because
    # root without file_admin passes no permission check on the Ultar kernel).
    "--listen", "/run/ultar/bus/updated.sock=system.updated", "--mode", "0660", "--group", "841", "--max-connections", "4",
    # Administration tools run by root: usettings, udevctl, ulog, uinit, ulaunch.
    "--listen", "/run/ultar/bus/system.sock=system.admin", "--mode", "0600", "--max-connections", "32",
    # The graphical installer (installation medium, user and group 840).
    "--listen", "/run/ultar/bus/installer.sock=system.installer", "--mode", "0660", "--group", "840", "--max-connections", "2",
    # Remote view source (843): the screen service of the viewed device.
    "--listen", "/run/ultar/bus/screend.sock=system.screend", "--mode", "0660", "--group", "843", "--max-connections", "4",
    # The service manager (root).
    "--listen", "/run/ultar/bus/init.sock=system.init", "--mode", "0600", "--max-connections", "2",
    # The apps' socket (bound read-only only into the cell of an app whose signed manifest declares
    # bus access, launcher.toml app_bus). Each app is its own identity app.<id>: busd reads the
    # peer's user id from the kernel (SO_PEERCRED) and looks it up in the launcher's map (owner 805,
    # only ids of the app range, only app.<id> names, re-read when it changes); an app without a
    # line - no bus declaration - is refused. The policy then applies per app (app.settings,
    # app.store … plus app.*). Open to everyone (apps run as their own uids 20000-49999 without
    # groups); the connection limit bounds what they can take.
    "--listen-apps", "/run/ultar/appbus/bus.sock", "--mode", "0666", "--max-connections", "32",
    "--app-map", "/run/ultar/launcher/bus-apps.toml", "--app-map-owner", "805", "--app-uids", "20000-49999",
    "--policy", "/etc/ultar/bus-policy.toml",
    "--log-socket", "/run/ultar/log/busd.sock",
]
user = 801
groups = [802, 803, 804, 805, 813, 814, 815, 816, 817, 818, 819, 820, 821, 822, 823, 824, 825, 826, 827, 828, 829, 833, 834, 835, 837, 839, 840, 841, 843]
public_dirs = ["/run/ultar/bus", "/run/ultar/appbus"]
notify = true
after = ["logd"]
restart = "always"


# Boot profiles: the ordinary system and the installation medium's session
# (ultar.profile=installer, set by the Ultar kernel on an installer medium).
[profiles]
system = "start"
installer = "start"

[cgroup]
"memory.max" = "64M"
"pids.max" = "448"
"cpu.weight" = "100"
