# Ultar OS design tokens – the ONE source of every visual value (docs/DESKTOP-SPEC.md §3).
# The UI toolkit (platform/ultar-ui) and the design artboards are both generated from this file.
# No colour, size or radius may be written anywhere else.

[space]            # logical points; nothing else is allowed
values = [4, 8, 12, 16, 24, 32, 48]

[radius]
control = 8        # buttons, inputs, list rows
card = 12          # cards, windows, sheets
round = 9999       # switches, avatars, pills

[type]
sizes = [12, 14, 16, 20, 24, 32]
body = 14
line_height_latin = 1.5
line_height_arabic = 1.6
family_arabic_text = "Noto Naskh Arabic"
family_arabic_title = "Noto Kufi Arabic"
family_latin = "Noto Sans"
family_mono = "Noto Sans Mono"
family_mono_arabic = "Noto Sans Arabic"   # Arabic inside fixed-width text (Noto Sans Mono has no Arabic)
weights = [400, 500, 600, 700]
small_weight_arabic = 500  # Arabic below body size is drawn one step heavier (Naskh at 12 is light)

[size]
bar_height = 56            # the single bar at the bottom (standard)
titlebar_height = 40
target_pointer_min = 32
target_touch_min = 44
icon_small = 16
icon = 24
stroke = 1.5
focus_ring = 2
border = 1                 # borders and separators (logical points)
row_min = 56               # minimum height of a settings or list row
box = 24                   # check box, radio circle
scroll_line = 48           # one wheel step
touch_slop = 8             # a finger that moves less still taps
toast_width = 400          # a toast (narrower on a small surface)

[motion]                   # milliseconds
feedback = 120
fade = 200
overview = 300
tooltip_delay = 600        # pointer rest before a tooltip
long_press = 500           # touch hold = secondary click; hold buttons start repeating
repeat = 80                # repeat interval of a held button
double_click = 400         # second press within this time = double click
spinner_period = 1200      # one revolution of a progress ring / pass of a busy bar
toast = 4000               # a toast without action hides after this time
toast_action = 10000       # a toast with an action: longer, paused under pointer or focus

[layout]                   # size classes by logical width
compact_max = 599
medium_max = 1023

[theme.dark]               # standard
ground = "#0B0D11"
bar = "#12151B"
surface = "#171A21"
raised = "#1F232C"
hover = "#262B36"
line = "#2E333E"           # decorative separators
control_border = "#6F7789" # borders of inputs and switches (>= 3:1 on surface)
text = "#F2F0EA"
text_muted = "#A9ADB8"
accent = "#D4AF37"         # brand gold: the one main action, and "on"
on_accent = "#14110A"
accent_text = "#E3C55A"
info = "#7FB2FF"
success = "#6FD08C"
warning = "#F0B95A"
danger = "#FF8A80"

[theme.light]
ground = "#E9EBEF"
bar = "#F7F8FA"
surface = "#FFFFFF"
raised = "#F3F4F7"
hover = "#E6E8EE"
line = "#D5D9E0"
control_border = "#767E90"
text = "#15171C"
text_muted = "#565C6B"
accent = "#C9A227"
on_accent = "#14110A"
accent_text = "#785B00"
info = "#1E5CB9"
success = "#1B6D36"
warning = "#835500"
danger = "#B3261E"

[theme.contrast]           # accessibility.high_contrast (over either theme): text >= 7:1 everywhere
ground = "#000000"
bar = "#000000"
surface = "#000000"
raised = "#0A0A0A"
hover = "#242424"
line = "#FFFFFF"
control_border = "#FFFFFF"
text = "#FFFFFF"
text_muted = "#E6E6E6"
accent = "#FFD400"
on_accent = "#000000"
accent_text = "#FFE14D"
info = "#A8CFFF"
success = "#8CFFA8"
warning = "#FFD166"
danger = "#FFA099"

[shadow]                   # one elevation level for everything that floats (CSS: 0 offset_y blur)
offset_y = 12
blur = 32
alpha_dark = 0.40
alpha_light = 0.18

[state]                    # how interaction states change a widget; the same for every widget
disabled_opacity = 0.40    # whole widget
hover_overlay = 0.10       # share of the foreground colour laid over a filled colour
pressed_overlay = 0.20
selection_opacity = 0.35  # accent behind selected text in a field
scrim_dark = 0.60          # ground colour laid over everything behind a dialog or sheet
scrim_light = 0.40
focus_ring = "info"        # colour role of the focus ring (DESKTOP-SPEC §3: blue next to the gold)
spinner_sweep = 0.75       # share of the circle a progress ring draws
busy_segment = 0.33        # share of the track the segment of a busy bar covers
