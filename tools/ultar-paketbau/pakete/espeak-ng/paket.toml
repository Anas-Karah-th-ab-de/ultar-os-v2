# Ultar Sprachausgabe: eSpeak NG (text to speech on the device, no cloud; Arabic, English, German
# and more than a hundred other languages). Built from the unmodified upstream release; stands on
# the package `grafik-laufzeit` (C library and loader). Used by `ultar-voiced`
# (docs/integration/ultar-voiced.md): the service starts `espeak-ng --stdout` for each answer and
# plays the WAV it writes.
#
# eSpeak NG is GPL-3.0-or-later. The program is started as a separate process and talks only through
# its command line and the audio it writes; no code of it is linked into any other Ultar program.
# No optional libraries: no MBROLA, no libsonic, no PulseAudio; the sound goes through `ultar-audiod`.
#
# Update from upstream: `ultar-paketbau outdated` lists newer releases; change `version` and
# `sha256` of the part, build, run the checks. No patches.

id = "espeak-ng"
name = "Ultar Sprachausgabe"
version = "1"
arch = "x86_64"
prefix = "/pkg/espeak-ng"
uses = ["/pkg/grafik-laufzeit"]
host_needs = ["gcc", "g++", "make", "python3", "git", "curl", "tar", "patch", "xz"]

env = [
  ["PKG_CONFIG_ALLOW_SYSTEM_CFLAGS", "1"],
  ["PKG_CONFIG_ALLOW_SYSTEM_LIBS", "1"],
]
runtime_env = [
  ["CC", "gcc -isystem /pkg/grafik-laufzeit/include -B/pkg/grafik-laufzeit/lib"],
  ["CXX", "g++ -isystem /pkg/grafik-laufzeit/include -B/pkg/grafik-laufzeit/lib"],
  ["LDFLAGS", "-L/pkg/grafik-laufzeit/lib -Wl,-rpath,{prefix}/lib:/pkg/grafik-laufzeit/lib -Wl,--dynamic-linker=/pkg/grafik-laufzeit/lib/ld-linux-x86-64.so.2 -static-libstdc++ -static-libgcc"],
]
remove = ["include", "lib/*.a", "lib/cmake", "lib/pkgconfig", "share/man", "share/vim"]

# ---- build tools (not shipped; the same parts as in llama and whisper) ----------------------

[[part]]
name = "ninja"
kind = "tool"
version = "1.13.2"
source = "https://github.com/ninja-build/ninja/archive/refs/tags/v{version}.tar.gz"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"
upstream = "https://github.com/ninja-build/ninja"
tag = "v{version}"
license = "Apache-2.0"
why = "runs the builds cmake describes"
build = ["python3 configure.py --bootstrap", "install -Dm755 ninja {tools}/bin/ninja"]

[[part]]
name = "cmake"
kind = "tool"
version = "4.5.1"
source = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}.tar.gz"
sha256 = "a79bf33cbe05686fdf79c2bbbcfe5e8e62ad16d3d540fa737cbedfeed41fb69e"
upstream = "https://github.com/Kitware/CMake"
tag = "v{version}"
license = "BSD-3-Clause"
why = "build system of eSpeak NG"
build = ["./bootstrap --prefix={tools} --parallel={jobs} -- -DCMAKE_USE_OPENSSL=OFF -DBUILD_TESTING=OFF", "make -j{jobs}", "make install"]

# ---- the package ----------------------------------------------------------------------------

[[part]]
name = "espeak-ng"
kind = "runtime"
version = "1.52.0"
source = "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/{version}.tar.gz"
sha256 = "bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23"
upstream = "https://github.com/espeak-ng/espeak-ng"
tag = "{version}"
not_ending = "android"
license = "GPL-3.0-or-later"
why = "speaks the helper's answers aloud on the device (Arabic first, then English and German)"
build = [
  "echo | g++ -xc++ -E -v - 2>&1 | grep '^ /.*c++' | sed 's/^ / -isystem /' | tr -d '\\n' > cxx-dirs",
  "CC=\"gcc -isystem /pkg/grafik-laufzeit/include -B/pkg/grafik-laufzeit/lib\" CXX=\"g++ $(cat cxx-dirs) -isystem /pkg/grafik-laufzeit/include -B/pkg/grafik-laufzeit/lib\" cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={prefix} -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DUSE_ASYNC=OFF -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DUSE_SPEECHPLAYER=OFF -DCMAKE_EXE_LINKER_FLAGS=\"-L/pkg/grafik-laufzeit/lib -Wl,--dynamic-linker=/pkg/grafik-laufzeit/lib/ld-linux-x86-64.so.2 -static-libstdc++ -static-libgcc\"",
  "cmake --build build -j{jobs}",
  "cmake --install build",
]

# ---- proof that the package works with nothing but itself and the package below ------------

[[check]]
name = "eSpeak NG starts and knows Arabic"
build = []
run = "{prefix}/bin/espeak-ng --voices=ar"
expect = "Arabic"

[[check]]
name = "eSpeak NG writes speech as WAV on the standard output"
build = []
run = "{prefix}/bin/espeak-ng -v ar --stdout hello"
expect = "RIFF"
