[package]
name = "settings-e2e"
version = "0.8.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "End-to-end test of the Settings app against the real settings and volume services under the service manager, with the code of the services that follow its settings (tools: may join apps and services)."
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
ultar-settings = { path = "../../apps/ultar-settings" }
ultar-displayd = { path = "../../platform/ultar-displayd" }
ultar-desktop = { path = "../../platform/ultar-desktop" }
ultar-launcher = { path = "../../system/core/ultar-launcher" }
ultar-surface = { path = "../../platform/ultar-surface" }
ultar-ui = { path = "../../platform/ultar-ui" }
ultar-bus = { path = "../../system/core/ultar-bus" }
ultar-i18n = { path = "../../system/core/ultar-i18n" }
ultar-update = { path = "../../system/core/ultar-update" }
# The volume service follows the Storage page settings; the example checks its own code.
ultar-volumed = { path = "../../system/services/ultar-volumed" }
# The services that follow the Users and Emergency settings (their own code checks
# the effect, with their own identity on the bus).
ultar-accountd = { path = "../../system/services/ultar-accountd" }
ultar-sessiond = { path = "../../system/services/ultar-sessiond" }
ultar-call = { path = "../../system/services/ultar-call" }
# The example stops the service manager and measures the storage itself.
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

[[example]]
name = "settingstest"
path = "examples/settingstest.rs"
