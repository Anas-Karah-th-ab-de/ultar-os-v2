    # Ultar Store (static, signed): catalogue + packages, GET/HEAD only. Installed by
    # tools/release/vps/setup.sh into the ultar.code-craft.tech server block.
    location ^~ /store/ {
        include snippets/ultar-headers.conf;
        limit_except GET HEAD { deny all; }
        autoindex off;
        default_type application/octet-stream;
        types { text/plain toml sig ed25519; application/octet-stream uap; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
