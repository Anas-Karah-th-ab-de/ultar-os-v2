# Standalone workspace (x86 server), separate from the aarch64 device workspace.
[workspace]

[package]
name = "ultraos-server"
version = "0.9.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Ultar cloud: public store catalogue and system updates, accounts, numbers, call signalling, entitlements, WireGuard provisioning (ultar.code-craft.tech)"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body = "1"
tower = { version = "0.5", features = ["util"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
ureq = { version = "2", default-features = false }
tempfile = "3"
tokio-tungstenite = "0.24"

[lib]
name = "ultraos_server"
path = "src/lib.rs"

[[bin]]
name = "ultraos-server"
path = "src/main.rs"

# Password hashing is far too slow unoptimised; tests register several accounts.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
