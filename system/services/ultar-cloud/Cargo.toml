[package]
name = "ultar-cloud"
version = "0.7.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Ultar cloud client: store catalogue and system updates without an account; account, number, VPN provisioning and premium content with one (server: ultar.code-craft.tech)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
ultar-vpn = { path = "../ultar-vpn" }
ultar-pkg = { path = "../../core/ultar-pkg" }
ultar-i18n = { path = "../../core/ultar-i18n" }

[dev-dependencies]
tempfile = "3"

[lib]
name = "ultar_cloud"
path = "src/lib.rs"

[[bin]]
name = "ucloud"
path = "src/bin/ucloud.rs"
