# Device service: driver selection, health check, fallback, quarantine.
# Changing a driver choice or stopping the service needs the permission
# devices.admin (bus policy).
exec = "/usr/bin/ultar-devd"
args = [
    "--depot", "/usr/lib/ultar/drivers",
    "--keys", "/etc/ultar/trusted-keys",
    "--state", "/data/ultar/devd",
    "--bus", "/run/ultar/bus/devd.sock",
    "--policy", "/etc/ultar/bus-policy.toml",
    "--log-socket", "/run/ultar/log/devd.sock",
]
# Its own user without kernel rights; its bus and log sockets are open to
# its group (804).
user = 804
dirs = ["/data/ultar/devd"]
notify = true
after = ["bus"]
restart = "always"


# Boot profiles: the ordinary system and the installation medium's session
# (ultar.profile=installer, set by the Ultar kernel on an installer medium).
[profiles]
system = "start"
installer = "start"

[cgroup]
"memory.max" = "64M"
"pids.max" = "64"
"cpu.weight" = "50"
