[package]
name = "ultar-shell"
version.workspace = true
edition.workspace = true

[dependencies]
ultar-sprache = { path = "../../system/core/ultar-sprache" }
zeno = "0.3"
cosmic-text = "0.19"
drm = "0.15"
nix = { version = "0.29", features = ["poll", "fs", "time", "hostname", "signal", "process", "reboot"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ultar-telegram = { path = "../../external/ultar-telegram" }
ultar-secure = { path = "../../system/core/ultar-secure" }
ultar-vpn = { path = "../../system/services/ultar-vpn" }
ultar-cloud = { path = "../../system/services/ultar-cloud" }
ultar-call = { path = "../../system/services/ultar-call" }
ultar-notify = { path = "../../system/services/ultar-notify" }
ultar-radio = { path = "../../system/services/ultar-radio" }
ultar-ime = { path = "../ultar-ime" }
ultar-edition = { path = "../../system/core/ultar-edition" }
ultar-office = { path = "../../apps/ultar-office" }
# Modellkatalog, Empfehlung und Herunterladen (Hugging Face / Ollama) – ohne Rechenkern
ultar-llm = { path = "../../system/services/ultar-llm", default-features = false }
base64 = "0.22"

[features]
# Für den Gerätebau einschalten -> echtes Telegram-Netz (grammers MTProto):
telegram-real = ["ultar-telegram/real"]
# Echter Anruf-Signalisierungs-Client (sonst Mock):
call-real = ["ultar-call/real"]
