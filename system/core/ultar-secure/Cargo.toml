[package]
name = "ultar-secure"
version.workspace = true
edition.workspace = true
description = "Geräteverschlüsselung (LUKS2) und verifizierter Start (dm-verity) — orchestriert geprüfte Standard-Werkzeuge, keine eigene Kryptografie."

[dependencies]
nix = { version = "0.29", features = ["mount", "process", "fs"] }

[lib]
name = "ultar_secure"
path = "src/lib.rs"

[[bin]]
name = "usecurectl"
path = "src/bin/usecurectl.rs"

[[bin]]
name = "ultar-stage0"
path = "src/bin/stage0.rs"
