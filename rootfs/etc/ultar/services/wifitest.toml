# Nur Entwicklungs-Image: Test-Zugangspunkt "UltarTest" (Kennwort geheim1234) auf dem zweiten
# simulierten Funkgerät (Modul mac80211_hwsim). Start: Kernel-Parameter ultar.start=wifitest
manual = true
exec = "/usr/lib/ultar/wifitest.sh"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: manual Wi-Fi test: access point (hostapd through the compat runner), interface address
#   (ifconfig), /proc/sys network switches, DHCP server.
# right net_admin: interface address and network switches
# right mount: hostapd runs through the compat runner
rights = ["net_admin", "mount"]
restart = "never"
