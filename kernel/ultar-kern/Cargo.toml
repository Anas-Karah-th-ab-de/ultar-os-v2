[package]
name = "ultar-kern"
version = "0.8.1"
edition = "2021"
description = "Ultar-Kern – eigener Rust-Kernel von KM Code Craft (UEFI, eigene Treiber, Treiber-Werkstatt)"
license = "Proprietary"

# eigener Bau (Ziel x86_64-unknown-uefi, kein std) – nicht Teil des Geräte-Workspace
[workspace]

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["const_mut_refs", "use_spin"] }
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }
# A/B boot contract shared with the loader and the updater (slot names, load options, GPT reader)
ultar-slots = { path = "../../system/core/ultar-slots" }
# Intel display engine logic (register layout, takeover, DP, PHY, mode set), tested on the host
ultar-intel-display = { path = "../../drivers/kernel/intel-display" }
# Intel GT logic (render/compute side of the same device: identification, forcewake, GuC upload)
ultar-intel-gt = { path = "../../drivers/kernel/intel-gt" }
# Intel NPU logic (identification, PLL work point, power sequences, firmware container)
ultar-intel-npu = { path = "../../drivers/kernel/intel-npu" }
# product and company identity: names, brand texts (one no_std source for every program)
# with the company logo bitmap (boot picture, installer welcome)
ultar-brand = { path = "../../system/core/ultar-brand", features = ["bitmaps"] }
# data partition decryption (crypt.rs): reviewed RustCrypto ciphers, software AES (aes_force_soft)
aes = { version = "0.8", default-features = false }
xts-mode = { version = "0.5", default-features = false }

[features]
# Remote hardware test without anyone at the machine: a deadline restarts the computer if the
# kernel has not finished in time, and the self test restarts instead of waiting for input.
remote-test = []
