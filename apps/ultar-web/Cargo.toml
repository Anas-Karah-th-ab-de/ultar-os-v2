[package]
name = "ultar-web"
version.workspace = true
edition.workspace = true
description = "Ultar Web – Browser mit Rust-Kern (WPE WebKit ueber eigene WPEPlatform-Plattform), ohne Ubuntu"

[dependencies]
cosmic-text = "0.19"
drm = "0.15"
nix = { version = "0.29", features = ["poll", "fs", "time"] }
libc = "0.2"
zeno = "0.3"
ultar-ime = { path = "../../platform/ultar-ime" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ultar_engine)'] }
