# Ultar Servo-Laufzeit: everything the Servo engine host of the Ultar Browser (`ultar-web-engine`,
# external/servo-host) needs at run time besides the program itself – built from unmodified
# upstream releases, nothing taken from a distribution:
#
#   C library and loader (glibc), the GCC runtime (libstdc++, libgcc_s – built from the GCC
#   sources), zlib, bzip2, libpng, brotli, expat, FreeType, fontconfig, libdrm and Mesa with
#   EGL (surfaceless platform), GBM and the gallium drivers llvmpipe (software, LLVM JIT) and
#   iris (Intel GPUs).
#
# It is built at its final place, the bundle of the engine: `/usr/lib/ultar/web`
# (`scripts/bundle-servo-engine.sh` adds `libexec/ultar-web-engine`, the fonts and the font
# configuration and checks that nothing points outside). Everything here is linked with the
# bundle's own loader and the run path `/usr/lib/ultar/web/lib`: no LD_LIBRARY_PATH needed.
#
# Build it in a work directory that already holds the build tools of `grafik-laufzeit` (cmake,
# ninja, meson, LLVM with clang and the SPIR-V translator, mako ...): the tool parts below are the
# same text, so they are skipped there. In an empty work directory they are built first (about
# 25 minutes, most of it LLVM, X86 target only; Mesa's llvmpipe uses that LLVM as a static
# library: nothing of LLVM is shipped).
#
# The build machine provides only: a C/C++ compiler, make, python3 and the headers of the
# Linux kernel interface (`/usr/include/linux`). Everything else is built here.
#
# Update from upstream: `ultar-paketbau outdated` lists newer releases; change `version` and
# `sha256` of the part, build, run the tests. Our own changes are patch files next to this
# recipe (none so far).

id = "servo-laufzeit"
name = "Ultar Servo-Laufzeit"
version = "1"
arch = "x86_64"
# built at its final place: the bundle of the browser engine (scripts/bundle-servo-engine.sh)
prefix = "/usr/lib/ultar/web"
host_needs = ["gcc", "g++", "make", "python3", "git", "curl", "tar", "patch", "xz"]

env = [
  # only what was built here is found, never a library of the build machine
  ["PKG_CONFIG_LIBDIR", "{prefix}/lib/pkgconfig:{prefix}/share/pkgconfig:{tools}/lib/pkgconfig:{tools}/share/pkgconfig"],
  ["PYTHONPATH", "{tools}/py"],
  # our pkg-config lives in {tools} and would treat {tools}/include as "known anyway"
  ["PKG_CONFIG_ALLOW_SYSTEM_CFLAGS", "1"],
  ["PKG_CONFIG_ALLOW_SYSTEM_LIBS", "1"],
]
runtime_env = [
  ["CC", "gcc -isystem {prefix}/include -B{prefix}/lib"],
  ["CXX", "g++ -isystem {prefix}/include -B{prefix}/lib"],
  ["LDFLAGS", "-L{prefix}/lib -Wl,-rpath,{prefix}/lib -Wl,--dynamic-linker={prefix}/lib/ld-linux-x86-64.so.2 -static-libstdc++ -static-libgcc"],
]
# needed to build against the package, not to run it
remove = ["include", "lib/*.a", "lib/*.la", "lib/*.o", "lib/pkgconfig", "share/pkgconfig", "share/i18n", "share/locale", "share/info", "share/man", "share/cmake", "lib/cmake", "var", "sbin", "libexec", "etc/rpc", "share/doc", "share/aclocal", "share/gettext"]

# ---- build tools (not shipped) -------------------------------------------------------------

[[part]]
name = "pkgconf"
kind = "tool"
version = "3.0.11"
source = "https://distfiles.ariadne.space/pkgconf/pkgconf-{version}.tar.xz"
sha256 = "d0cd841bc8e55b9da888106c00dc256d05b7d1d8e5a46f4be4eb4c5125bd2dc4"
upstream = "https://github.com/pkgconf/pkgconf"
tag = "pkgconf-{version}"
license = "ISC"
why = "finds the libraries built here (and only those)"
build = ["./configure --prefix={tools}", "make -j{jobs}", "make install", "ln -sf pkgconf {tools}/bin/pkg-config"]

[[part]]
name = "m4"
kind = "tool"
version = "1.4.21"
source = "https://ftpmirror.gnu.org/gnu/m4/m4-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/m4/m4-{version}.tar.xz"
sha256 = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
upstream = "https://git.savannah.gnu.org/git/m4.git"
tag = "v{version}"
license = "GPL-3.0-or-later (build tool, not shipped)"
why = "needed by bison and flex"
build = ["./configure --prefix={tools}", "make -j{jobs}", "make install"]

[[part]]
name = "bison"
kind = "tool"
version = "3.8.2"
source = "https://ftpmirror.gnu.org/gnu/bison/bison-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/bison/bison-{version}.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"
upstream = "https://git.savannah.gnu.org/git/bison.git"
tag = "v{version}"
license = "GPL-3.0-or-later (build tool, not shipped)"
why = "parser generator: C library and Mesa"
build = ["./configure --prefix={tools}", "make -j{jobs}", "make install"]

[[part]]
name = "flex"
kind = "tool"
version = "2.7.9"
source = "https://github.com/westes/flex/releases/download/v{version}/flex-{version}.tar.gz"
sha256 = "eda7d158abe845c49956554488a0749a637891124824a77ab16dadbe0ce58eb7"
upstream = "https://github.com/westes/flex"
tag = "v{version}"
license = "BSD-2-Clause"
why = "scanner generator: Mesa"
build = ["./configure --prefix={tools}", "make -j{jobs}", "make install"]

[[part]]
name = "gawk"
kind = "tool"
version = "5.4.2"
source = "https://ftpmirror.gnu.org/gnu/gawk/gawk-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/gawk/gawk-{version}.tar.xz"
sha256 = "b95e4909533b5f988c6b5e5539b3b3ddf76e7d7df02ca2e5b5b7d6f62db78e6a"
upstream = "https://git.savannah.gnu.org/git/gawk.git"
tag = "gawk-{version}"
license = "GPL-3.0-or-later (build tool, not shipped)"
why = "the C library's build scripts"
build = ["./configure --prefix={tools}", "make -j{jobs}", "make install"]

[[part]]
name = "ninja"
kind = "tool"
version = "1.13.2"
source = "https://github.com/ninja-build/ninja/archive/refs/tags/v{version}.tar.gz"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"
upstream = "https://github.com/ninja-build/ninja"
tag = "v{version}"
license = "Apache-2.0"
why = "runs the builds meson and cmake describe"
build = ["python3 configure.py --bootstrap", "install -Dm755 ninja {tools}/bin/ninja"]

[[part]]
name = "meson"
kind = "tool"
version = "1.12.1"
source = "https://github.com/mesonbuild/meson/releases/download/{version}/meson-{version}.tar.gz"
sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743"
upstream = "https://github.com/mesonbuild/meson"
tag = "{version}"
license = "Apache-2.0"
why = "build system of libdrm and Mesa"
build = [
  "rm -rf {tools}/meson && mkdir -p {tools}/meson {tools}/bin && cp -r . {tools}/meson/",
  "printf '#!/bin/sh\\nexec python3 {tools}/meson/meson.py \"$@\"\\n' > {tools}/bin/meson && chmod +x {tools}/bin/meson",
]

[[part]]
name = "cmake"
kind = "tool"
version = "4.5.1"
source = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}.tar.gz"
sha256 = "a79bf33cbe05686fdf79c2bbbcfe5e8e62ad16d3d540fa737cbedfeed41fb69e"
upstream = "https://github.com/Kitware/CMake"
tag = "v{version}"
license = "BSD-3-Clause"
why = "build system of the Vulkan loader"
build = ["./bootstrap --prefix={tools} --parallel={jobs} -- -DCMAKE_USE_OPENSSL=OFF -DBUILD_TESTING=OFF", "make -j{jobs}", "make install"]

# ---- build tools of Mesa (not shipped) --------------------------------------------------------

[[part]]
name = "markupsafe"
kind = "tool"
version = "3.0.4"
source = "https://github.com/pallets/markupsafe/archive/refs/tags/{version}.tar.gz"
sha256 = "d10493b310df657ec6e719f2c3e49a2e9189bfe065e3ba4b9c339c586979d5bc"
upstream = "https://github.com/pallets/markupsafe"
tag = "{version}"
license = "BSD-3-Clause"
why = "needed by mako"
build = ["mkdir -p {tools}/py && rm -rf {tools}/py/markupsafe && cp -r src/markupsafe {tools}/py/"]

[[part]]
name = "mako"
kind = "tool"
version = "1.4.3"
source = "https://github.com/sqlalchemy/mako/archive/refs/tags/rel_{version_}.tar.gz"
sha256 = "233bb6599ff404f4fab751433f6c192a301b9fb1ecdc3403f6bcd81f2fde48b4"
upstream = "https://github.com/sqlalchemy/mako"
tag = "rel_{version_}"
license = "MIT"
why = "templates Mesa generates code with"
build = ["mkdir -p {tools}/py && rm -rf {tools}/py/mako && cp -r mako {tools}/py/"]

[[part]]
name = "pyyaml"
kind = "tool"
version = "6.0.4"
source = "https://github.com/yaml/pyyaml/archive/refs/tags/{version}.tar.gz"
sha256 = "7e0ed50e671963a9ab3e6134c9b1e808fe50a1ce995e8436c37014e3c970ac92"
upstream = "https://github.com/yaml/pyyaml"
tag = "{version}"
license = "MIT"
why = "Mesa's build scripts"
build = ["mkdir -p {tools}/py && rm -rf {tools}/py/yaml && cp -r lib/yaml {tools}/py/"]

[[part]]
name = "packaging"
kind = "tool"
version = "26.4"
source = "https://github.com/pypa/packaging/archive/refs/tags/{version}.tar.gz"
sha256 = "3b2c03aa67b871127125250e0bebdfb25488cffca0bc1f3477646ff9ecf868af"
upstream = "https://github.com/pypa/packaging"
tag = "{version}"
license = "Apache-2.0 OR BSD-2-Clause"
why = "Mesa's build scripts"
build = ["mkdir -p {tools}/py && rm -rf {tools}/py/packaging && cp -r src/packaging {tools}/py/"]

[[part]]
name = "spirv-headers"
kind = "tool"
version = "1.4.363.0"
source = "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-{version}.tar.gz"
sha256 = "5b3a0d099f5c7649e29c0938476c462e71d66ad89a0bde42fa1ba3eb476956c9"
upstream = "https://github.com/KhronosGroup/SPIRV-Headers"
tag = "vulkan-sdk-{version}"
license = "MIT"
why = "the SPIR-V format (for the shader tools)"
build = ["cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX={tools}", "cmake --install build"]

[[part]]
name = "spirv-tools"
kind = "tool"
version = "1.4.363.0"
source = "https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/vulkan-sdk-{version}.tar.gz"
sha256 = "e6c83a215538fbfd265ccf398d3877985055df1273dbed73912bd05307664688"
upstream = "https://github.com/KhronosGroup/SPIRV-Tools"
tag = "vulkan-sdk-{version}"
license = "Apache-2.0"
why = "checks and links the shaders Mesa builds into the driver"
build = [
  "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={tools} -DCMAKE_INSTALL_LIBDIR=lib -DSPIRV-Headers_SOURCE_DIR={build}/spirv-headers -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF -DBUILD_SHARED_LIBS=OFF",
  "cmake --build build -j{jobs}",
  "cmake --install build",
]

[[part]]
name = "glslang"
kind = "tool"
version = "1.4.363.0"
source = "https://github.com/KhronosGroup/glslang/archive/refs/tags/vulkan-sdk-{version}.tar.gz"
sha256 = "cda24ec765e6d2845d106b7caa593f34127195a88524cf87821ff0088fb6edec"
upstream = "https://github.com/KhronosGroup/glslang"
tag = "vulkan-sdk-{version}"
license = "BSD-3-Clause"
why = "translates the shaders Mesa builds into the driver (glslangValidator)"
build = [
  "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={tools} -DCMAKE_INSTALL_LIBDIR=lib -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DBUILD_SHARED_LIBS=OFF",
  "cmake --build build -j{jobs}",
  "cmake --install build",
]

[[part]]
name = "spirv-llvm-translator"
kind = "tool"
version = "23.1.3"
source = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/refs/tags/v{version}.tar.gz"
sha256 = "9ed57de3f31c575c836bef8f05ce5dfa98a8d80e64d948a02aac83c2e124f842"
upstream = "https://github.com/KhronosGroup/SPIRV-LLVM-Translator"
tag = "v{version}"
license = "NCSA"
why = "turns compiler output into SPIR-V; built inside LLVM (next part), its major version must match LLVM's"
build = ["test -f CMakeLists.txt"]

[[part]]
name = "spirv-headers-llvm"
kind = "tool"
version = "23.1.3"
follows = "spirv-llvm-translator"
# the commit named in the translator's `spirv-headers-tag.conf`: it needs a newer state of the
# headers than the last released one
source = "https://github.com/KhronosGroup/SPIRV-Headers/archive/cb42dec3830d3ac67fa449ecdc0c0f73d5e74498.tar.gz"
sha256 = "117010e525fe36b1ce006e0e58a6e0a3b415aabc9179d912b92737f41f3f994f"
upstream = "https://github.com/KhronosGroup/SPIRV-Headers"
tag = ""
license = "MIT"
why = "the SPIR-V format in exactly the state the translator is written against"
build = ["test -f include/spirv/unified1/spirv.hpp"]

[[part]]
name = "llvm"
kind = "tool"
version = "23.1.6"
source = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/llvm-project-{version}.src.tar.xz"
sha256 = "d3b86ab29cfb4445a6652e5c2642ccc75e04e38084dde3701d323320f35a31da"
upstream = "https://github.com/llvm/llvm-project"
tag = "llvmorg-{version}"
license = "Apache-2.0 WITH LLVM-exception"
why = "compiler for the small programs Mesa's Intel driver carries (clang, SPIR-V translator); only used while building"
build = [
  "cmake -S llvm -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={tools} -DLLVM_ENABLE_PROJECTS=clang -DLLVM_ENABLE_RUNTIMES= -DLLVM_EXTERNAL_PROJECTS=llvm-spirv -DLLVM_EXTERNAL_LLVM_SPIRV_SOURCE_DIR={build}/spirv-llvm-translator -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR={build}/spirv-headers-llvm -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_ENABLE_RTTI=ON -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_BINDINGS=OFF -DCLANG_ENABLE_STATIC_ANALYZER=OFF -DCLANG_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_DOCS=OFF",
  "cmake --build build -j{jobs}",
  "cmake --install build",
]


# ---- more build tools (not shipped) ----------------------------------------------------------

[[part]]
name = "gperf"
kind = "tool"
version = "3.3"
source = "https://ftpmirror.gnu.org/gnu/gperf/gperf-{version}.tar.gz"
mirror = "https://ftp.gnu.org/gnu/gperf/gperf-{version}.tar.gz"
sha256 = "fd87e0aba7e43ae054837afd6cd4db03a3f2693deb3619085e6ed9d8d9604ad8"
upstream = "https://git.savannah.gnu.org/git/gperf.git"
tag = "v{version}"
license = "GPL-3.0-or-later (build tool, not shipped)"
why = "perfect hash generator: fontconfig"
build = ["./configure --prefix={tools}", "make -j{jobs}", "make install"]

[[part]]
name = "gmp"
kind = "tool"
version = "6.3.0"
source = "https://ftpmirror.gnu.org/gnu/gmp/gmp-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/gmp/gmp-{version}.tar.xz"
sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
upstream = "https://gmplib.org/repo/gmp"
tag = "gmp-{version}"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later (build tool, not shipped)"
why = "needed to build the GCC runtime"
# GMP 6.3.0's configure tests are older than the compiler's default language (C23): ask for C17
build = ["CC='gcc -std=gnu17' ./configure --prefix={tools} --disable-shared", "make -j{jobs}", "make install"]

[[part]]
name = "mpfr"
kind = "tool"
version = "4.2.2"
source = "https://ftpmirror.gnu.org/gnu/mpfr/mpfr-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/mpfr/mpfr-{version}.tar.xz"
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
upstream = "https://gitlab.inria.fr/mpfr/mpfr"
tag = "{version}"
license = "LGPL-3.0-or-later (build tool, not shipped)"
why = "needed to build the GCC runtime"
build = ["./configure --prefix={tools} --disable-shared --with-gmp={tools}", "make -j{jobs}", "make install"]

[[part]]
name = "mpc"
kind = "tool"
version = "1.3.1"
source = "https://ftpmirror.gnu.org/gnu/mpc/mpc-{version}.tar.gz"
mirror = "https://ftp.gnu.org/gnu/mpc/mpc-{version}.tar.gz"
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
upstream = "https://gitlab.inria.fr/mpc/mpc"
tag = "{version}"
license = "LGPL-3.0-or-later (build tool, not shipped)"
why = "needed to build the GCC runtime"
build = ["./configure --prefix={tools} --disable-shared --with-gmp={tools} --with-mpfr={tools}", "make -j{jobs}", "make install"]

# ---- the package ----------------------------------------------------------------------------

[[part]]
name = "glibc"
kind = "runtime"
version = "2.44"
source = "https://ftpmirror.gnu.org/gnu/glibc/glibc-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/glibc/glibc-{version}.tar.xz"
sha256 = "37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667"
upstream = "https://sourceware.org/git/glibc.git"
tag = "glibc-{version}"
not_ending = ".9000"
license = "LGPL-2.1-or-later"
why = "C library and program loader of the bundle"
build = [
  "mkdir build",
  "cd build && env -u CC -u CXX -u LDFLAGS ../configure --prefix={prefix} --libdir={prefix}/lib --disable-werror --disable-nscd --without-selinux libc_cv_slibdir={prefix}/lib libc_cv_rtlddir={prefix}/lib",
  "cd build && env -u CC -u CXX -u LDFLAGS make -j{jobs}",
  "cd build && env -u CC -u CXX -u LDFLAGS make install",
]

[[part]]
name = "gcc-runtime"
kind = "runtime"
version = "15.2.0"
source = "https://mirrors.dotsrc.org/gnu/gcc/gcc-{version}/gcc-{version}.tar.xz"
mirror = "https://ftp.gnu.org/gnu/gcc/gcc-{version}/gcc-{version}.tar.xz"
sha256 = "438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e"
upstream = "https://gcc.gnu.org/git/gcc.git"
tag = "releases/gcc-{version}"
license = "GPL-3.0-or-later WITH GCC-exception-3.1 (libstdc++, libgcc_s: GCC Runtime Library Exception)"
why = "libstdc++ and libgcc_s of the bundle: Servo's SpiderMonkey and the host are C++/Rust code that need them at run time. Only the two shared libraries are taken from this build (the compiler is built to get them, not shipped); the licence allows shipping them, the source is the pinned release named here"
# The target libraries are compiled by the compiler built in this part against the build
# machine's glibc headers (symbol versions glibc 2.44 offers as well). Only the shared libraries
# are copied into the package: no headers, no static libraries (the C++ headers would otherwise
# reach the include path of the parts after this one).
build = [
  "mkdir build",
  "cd build && env -u CC -u CXX -u LDFLAGS ../configure --prefix={build}/gcc-install --disable-multilib --enable-languages=c,c++ --disable-bootstrap --disable-nls --disable-libsanitizer --disable-libgomp --disable-libquadmath --disable-libatomic --disable-libssp --disable-libvtv --disable-libitm --disable-libstdcxx-pch --with-gmp={tools} --with-mpfr={tools} --with-mpc={tools}",
  "cd build && env -u CC -u CXX -u LDFLAGS make -j{jobs} all-target-libgcc all-target-libstdc++-v3",
  "cd build && env -u CC -u CXX -u LDFLAGS make install-target-libgcc install-target-libstdc++-v3",
  "mkdir -p {prefix}/lib {prefix}/share/ultar/licenses",
  "for f in $(find {build}/gcc-install -name 'libstdc++.so.6*' -o -name 'libgcc_s.so.1' | grep -v gdb); do cp -a $f {prefix}/lib/; done",
  "cp COPYING3 COPYING.RUNTIME {prefix}/share/ultar/licenses/",
]

[[part]]
name = "zlib"
kind = "runtime"
version = "1.4"
source = "https://github.com/madler/zlib/releases/download/v{version}/zlib-{version}.tar.gz"
sha256 = "02dd159783677a749c04adbdd02b55b8a2bcc7e054f51b76b549199a916ad584"
upstream = "https://github.com/madler/zlib"
tag = "v{version}"
license = "Zlib"
why = "compression (Servo, FreeType, libpng, Mesa)"
build = ["./configure --prefix={prefix}", "make -j{jobs}", "make install"]

[[part]]
name = "bzip2"
kind = "runtime"
version = "1.0.8"
source = "https://sourceware.org/pub/bzip2/bzip2-{version}.tar.gz"
sha256 = "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"
upstream = "https://sourceware.org/git/bzip2.git"
tag = "bzip2-{version}"
license = "bzip2-1.0.6"
why = "compressed fonts (FreeType)"
build = [
  "make -f Makefile-libbz2_so CC=\"$CC\" -j{jobs}",
  "install -d {prefix}/lib {prefix}/include",
  "install -m 644 bzlib.h {prefix}/include/",
  "cp -a libbz2.so.{version} {prefix}/lib/ && ln -sf libbz2.so.{version} {prefix}/lib/libbz2.so.1.0 && ln -sf libbz2.so.1.0 {prefix}/lib/libbz2.so",
]

[[part]]
name = "libpng"
kind = "runtime"
version = "1.6.50"
source = "https://download.sourceforge.net/libpng/libpng-{version}.tar.xz"
sha256 = "4df396518620a7aa3651443e87d1b2862e4e88cad135a8b93423e01706232307"
upstream = "https://github.com/pnggroup/libpng"
tag = "v{version}"
license = "libpng-2.0"
why = "bitmap fonts and emoji (FreeType)"
build = ["./configure --prefix={prefix}", "make -j{jobs}", "make install"]

[[part]]
name = "brotli"
kind = "runtime"
version = "1.2.0"
source = "https://github.com/google/brotli/archive/refs/tags/v{version}.tar.gz"
sha256 = "816c96e8e8f193b40151dad7e8ff37b1221d019dbcb9c35cd3fadbfe6477dfec"
upstream = "https://github.com/google/brotli"
tag = "v{version}"
license = "MIT"
why = "WOFF2 web fonts (FreeType)"
build = [
  "cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX={prefix} -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DBROTLI_DISABLE_TESTS=ON -DCMAKE_INSTALL_RPATH={prefix}/lib",
  "cmake --build out -j{jobs}",
  "cmake --install out",
]

[[part]]
name = "expat"
kind = "runtime"
version = "2.7.3"
source = "https://github.com/libexpat/libexpat/releases/download/R_{version_}/expat-{version}.tar.xz"
sha256 = "71df8f40706a7bb0a80a5367079ea75d91da4f8c65c58ec59bcdfbf7decdab9f"
upstream = "https://github.com/libexpat/libexpat"
tag = "R_{version_}"
license = "MIT"
why = "reads the font configuration (fontconfig)"
build = ["./configure --prefix={prefix} --without-docbook --without-examples --without-tests", "make -j{jobs}", "make install"]

[[part]]
name = "freetype"
kind = "runtime"
version = "2.15.0"
source = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.xz"
sha256 = "93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5"
upstream = "https://gitlab.freedesktop.org/freetype/freetype.git"
tag = "VER-{version_}"
license = "FTL OR GPL-2.0-or-later"
why = "reads font files (fontconfig, and Servo through fontconfig)"
build = [
  "meson setup build --prefix={prefix} --libdir=lib --buildtype=release -Dzlib=system -Dbzip2=enabled -Dpng=enabled -Dbrotli=enabled -Dharfbuzz=disabled",
  "ninja -C build -j{jobs} install",
]

[[part]]
name = "fontconfig"
kind = "runtime"
version = "2.16.0"
source = "https://www.freedesktop.org/software/fontconfig/release/fontconfig-{version}.tar.xz"
sha256 = "6a33dc555cc9ba8b10caf7695878ef134eeb36d0af366041f639b1da9b6ed220"
upstream = "https://gitlab.freedesktop.org/fontconfig/fontconfig.git"
tag = "{version}"
license = "HPND-sell-variant"
why = "finds fonts by name and language (Servo)"
# The bundle brings its own font configuration (etc/fonts/fonts.conf, written by the bundle
# script) that knows only the fonts of the bundle; the compiled-in places are the bundle's, too.
build = [
  "meson setup build --prefix={prefix} --libdir=lib --sysconfdir={prefix}/etc --localstatedir=/var --buildtype=release -Dxml-backend=expat -Ddoc=disabled -Dnls=disabled -Dtests=disabled -Dtools=enabled -Dcache-build=disabled -Ddefault-fonts-dirs={prefix}/share/fonts -Dadditional-fonts-dirs= -Dcache-dir=/tmp/ultar-web-fontconfig -Dtemplate-dir={prefix}/share/fontconfig/conf.avail -Dbaseconfig-dir={prefix}/etc/fonts -Dconfig-dir={prefix}/etc/fonts/conf.d",
  "ninja -C build -j{jobs} install",
]

[[part]]
name = "libdrm"
kind = "runtime"
version = "2.4.134"
source = "https://dri.freedesktop.org/libdrm/libdrm-{version}.tar.xz"
sha256 = "ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95"
upstream = "https://gitlab.freedesktop.org/mesa/libdrm.git"
tag = "libdrm-{version}"
license = "MIT"
why = "finds the GPU's device file and talks to it (Mesa)"
build = [
  "meson setup build --prefix={prefix} --libdir=lib --buildtype=release -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled -Dvmwgfx=disabled -Dtests=false -Dman-pages=disabled -Dvalgrind=disabled -Dcairo-tests=disabled",
  "ninja -C build -j{jobs} install",
]

[[part]]
name = "mesa"
kind = "runtime"
version = "26.3.1"
source = "https://archive.mesa3d.org/mesa-{version}.tar.xz"
sha256 = "4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961"
upstream = "https://gitlab.freedesktop.org/mesa/mesa.git"
tag = "mesa-{version}"
license = "MIT"
why = "OpenGL and EGL for Servo's pictures: llvmpipe (software, any processor) and iris (Intel GPUs); EGL with the surfaceless platform needs no window system"
build = [
  "meson setup build --prefix={prefix} --libdir=lib --buildtype=release -Dplatforms= -Dgallium-drivers=llvmpipe,iris -Dvulkan-drivers= -Dvulkan-layers= -Dtools= -Dvideo-codecs= -Dllvm=enabled -Dshared-llvm=disabled -Dopengl=true -Dgles1=disabled -Dgles2=enabled -Degl=enabled -Dgbm=enabled -Dglx=disabled -Dglvnd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dzstd=disabled -Dintel-rt=disabled -Dvalgrind=disabled -Dlibunwind=disabled -Dlmsensors=disabled -Dbuild-tests=false",
  "ninja -C build -j{jobs}",
  "ninja -C build install",
]

# ---- proof that the package works alone ---------------------------------------------------

[[check]]
name = "EGL (surfaceless) and OpenGL through llvmpipe with nothing but the package"
build = [
  "mkdir -p {prefix}/share/ultar/pruefung",
  "$CC -O2 -o {prefix}/share/ultar/pruefung/egl-probe {recipe}/pruefung/egl-probe.c $LDFLAGS -lEGL -ldl",
]
run = "{prefix}/share/ultar/pruefung/egl-probe"
expect = "EGL: llvmpipe ok"

[[check]]
name = "fontconfig starts with nothing but the package"
build = []
run = "{prefix}/bin/fc-list --version"
expect = "fontconfig version"
