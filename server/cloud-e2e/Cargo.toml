# End-to-end tests: the device client (ultar-cloud + ultar-pkg) against the real server.
# Test-only crate; the coordinator removes the [workspace] table on integration.
[workspace]

[package]
name = "ultar-cloud-e2e"
version = "0.7.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "End-to-end tests of the Ultar cloud client against ultraos-server"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ultar-cloud = { path = "../../system/services/ultar-cloud" }
ultar-pkg = { path = "../../system/core/ultar-pkg" }
ultar-i18n = { path = "../../system/core/ultar-i18n" }
ultraos-server = { path = "../ultraos-server" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde_json = "1"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
