[package]
name = "ultar-init"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ultar-init"
path = "src/main.rs"

[[bin]]
name = "uinit"
path = "src/bin/uinit.rs"

[dependencies]
nix = { version = "0.29", features = ["mount", "signal", "process", "reboot", "poll", "hostname", "kmod", "fs"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
ultar-profile = { path = "../ultar-profile" }
ultar-hal-system = { path = "../../hal/ultar-hal-system" }
ultar-sys = { path = "../../hal/ultar-sys" }
ultar-service = { path = "../ultar-service" }
ultar-bus = { path = "../ultar-bus" }
