[package]
name = "ultar-kern"
version = "0.4.0"
edition = "2021"
description = "Ultar-Kern – eigener Rust-Kernel von KM Code Craft (UEFI, eigene Treiber, Treiber-Werkstatt)"
license = "Proprietary"

# eigener Bau (Ziel x86_64-unknown-uefi, kein std) – nicht Teil des Geräte-Workspace
[workspace]

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["const_mut_refs", "use_spin"] }
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }
