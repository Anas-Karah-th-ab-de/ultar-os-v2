# Eigenständiges Workspace (x86-Server), getrennt vom aarch64-Geräte-Workspace.
[workspace]

[package]
name = "ultraos-server"
version = "0.1.0"
edition = "2021"
description = "Ultar-Cloud: Konten, Rufnummern, Anruf-Signalisierung, Store, OTA-Updates, WireGuard-Provisionierung (ultar.code-craft.tech)"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "ultraos-server"
path = "src/main.rs"
