# Media service (docs/integration/system-services.md): the media session for
# the lock screen's media card. The latest player that reported holds it and
# must report again within 30 s; the shell's and lock screen's buttons reach
# it as media.command.
editions = ["phone", "desktop"]
exec = "/usr/bin/ultar-mediad"
args = [
    "--bus", "/run/ultar/bus/mediad.sock",
    "--policy", "/etc/ultar/bus-policy.toml",
    "--log-socket", "/run/ultar/log/mediad.sock",
    # Play there (docs/integration/mesh-calls.md): this device plays the sound of another
    # device's media session on its speaker, as a media stream of the sound server (its
    # socket; the stream is open for a session only). The service holds no kernel right.
    "--there-sink", "/run/ultar/audio/system.mediad.sock",
]
user = 824
notify = true
after = ["bus"]
restart = "always"

[cgroup]
"memory.max" = "16M"
"pids.max" = "16"
"cpu.weight" = "50"
