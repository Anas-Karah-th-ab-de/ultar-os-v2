# Intel WLAN (iwlwifi firmware interface). 8086:06f0 = Wi-Fi 6 AX201 (T1), 8086:272b = Wi-Fi 7 BE200 (T2).
# The closed vendor firmware is only loaded; the file names are fixed when the firmware is packaged.
id = "intel-wifi"
version = "1.0.0"
class = "wifi"
kernel_abi = ["ultar-kern-abi-1"]
origin = "hand"
rank = 50
name_key = "driver.intel-wifi.name"
description_key = "driver.intel-wifi.description"

[match]
pci = ["8086:06f0", "8086:272b"]

[content]
module = "drivers/intel_wifi.uko"
firmware = ["firmware/intel/wifi-ax201.ucode", "firmware/intel/wifi-be200.ucode"]
