# Intel 10 GbE. 8086:57b0 = E610-XT2 of the Beelink GTi15 Ultra (checked on the real device via VFIO).
id = "gen-ixgbe"
version = "1.0.0"
class = "net"
kernel_abi = ["ultar-kern-abi-1"]
origin = "workshop"
rank = 50
name_key = "driver.gen-ixgbe.name"
description_key = "driver.gen-ixgbe.description"

[match]
pci = ["8086:57b0"]

[content]
# Stage A (docs/PLAN.md §5.5): the driver is built into the Ultar kernel; the package
