# Device mesh (docs/integration/ultar-mesh.md): finds the person's other devices in the
# local network, pairs with a six-digit code, hands over what the person is doing, files
# and the clipboard – nothing arrives without a yes on this device. Listens on port 47810
# (TCP and UDP; /etc/ultar/firewall). Its key and the paired devices lie in --state.
#
# The kind of device follows the edition (ULTAR_EDITION: phone, desktop, server).
#
# Open (docs/OFFEN-VERBUND-HELFER.md): files. The person's file areas (/data/ultar/areas)
# are reachable for the launcher only, so this service can neither read a file to send
# (no --share) nor put a received one where the Files app shows it (the inbox is its
# own folder). Handing over what is open in an app works without files. Without --jobs
# no job of another device runs. Over the internet it goes through the relay of the Ultar
# account server, signed in with the device token the account service writes after the
# person signs in (read before every connection; signed out: no relay).
#
# Shared clipboard (docs/integration/mesh-clipboard.md): this user (833) holds the right
# ui.clipboard-bridge in compositor-rights.toml and reads the clipboard through the
# compositor only while the mesh is on: text (16 KiB) and pictures (4 MiB), never a
# password, never while the session is locked. It is off per device until the person
# switches "Share the clipboard" on in Settings > Mesh. One short notice per arrival
# (at most one in ten seconds) goes to the notification service.
editions = ["phone", "desktop", "server"]
exec = "/usr/bin/ultar-mesh"
args = [
    "--bus", "/run/ultar/bus/mesh.sock",
    "--state", "/data/ultar/mesh/state",
    "--inbox", "/data/ultar/mesh/inbox",
    "--log-socket", "/run/ultar/log/mesh.sock",
    "--relay", "wss://ultar.code-craft.tech/v1/verbund/relais",
    "--relay-token-file", "/data/ultar/account-relay/relay.token",
    "--compositor", "/run/ultar/ui/compositor.sock",
]
# Its own user (833) without kernel rights: ports above 1024 and its own folders; group
# accountrelay (838) to read the relay token.
user = 833
groups = [838]
dirs = ["/data/ultar/mesh", "/data/ultar/mesh/state", "/data/ultar/mesh/inbox"]
notify = true
after = ["bus"]
restart = "always"

[cgroup]
"memory.max" = "48M"
"pids.max" = "48"
"cpu.weight" = "50"
