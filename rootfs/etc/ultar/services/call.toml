# Call service (ultar-calld): voice and video calls of the phone app over the Ultar number and
# the mobile network (modem service `modem.*` of ultar-ril). Offers `call.*` on the bus and
# keeps the call history in /data/ultar/calls (0600, at most 128 KiB).
editions = ["phone", "desktop"]
exec = "/usr/bin/ultar-calld"
args = [
    "--bus", "/run/ultar/bus/calld.sock",
    "--log", "/data/ultar/calls/calls.log",
    "--modem",
    # Ultar-number calls end to end with the person's account (account.*): signalling at the
    # account server, the device key stays in the account service, sound through the sound
    # server's stream socket /run/ultar/audio/system.calld.sock (--audio).
    "--account",
    # Calls between the person's devices (docs/integration/mesh-calls.md): a ringing Ultar-number
    # call is offered to paired devices with the right "Anrufe und Ton" (off after pairing), and
    # this device answers calls that another device offers. The voice goes over the end-to-end
    # encrypted mesh. Mobile-network calls are not offered: no modem voice stream
    # (--mesh-modem-pcm NODE) is proven yet.
    "--mesh-calls", "--mesh-guest",
]
# Identity: its own user (829); it talks to the bus, the account server, the TURN relay and the
# other device (UDP), and to the sound server (stream socket, no kernel sound right).
# right camera: the pictures of /dev/ultar/kamera while a video call runs; no other device.
user = 829
rights = ["camera"]
dirs = ["/data/ultar/calls"]
after = ["bus"]
restart = "on-failure"

[cgroup]
"memory.max" = "32M"
"pids.max" = "16"
"cpu.weight" = "100"
