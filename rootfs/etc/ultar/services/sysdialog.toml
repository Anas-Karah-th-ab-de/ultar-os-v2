# System dialogs (ultar-sysdialog, role ui.system-dialog as user 815):
# permission prompts for the app launcher, administrator prompts and "keep
# these display settings?" (15 s, then the settings service reverts). The phone has
# its own: mobile-dialog.toml (ultar-mobile-dialog, sheets from the bottom edge).
editions = ["desktop"]
manual = true
exec = "/usr/bin/ultar-sysdialog"
args = [
    "--compositor", "/run/ultar/ui/compositor.sock",
    "--bus", "/run/ultar/bus/sysdialog.sock",
]
user = 815
after = ["compositor", "authd", "settingsd"]
restart = "always"

[cgroup]
"memory.max" = "96M"
"pids.max" = "16"
