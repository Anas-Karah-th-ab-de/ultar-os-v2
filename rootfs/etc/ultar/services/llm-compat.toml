# Alter Weg (Rückfall): llama-server aus llama.cpp im Ubuntu-Bereich. Nur nutzen, wenn ultar-llm fehlt:
#   ultar-ctl stop llm && ultar-ctl start llm-compat
manual = true
compat = true
exec = "/data/ultar/agent/llama-server"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: runs llama-server inside the Ubuntu compatibility tree; the compat runner (ultar-compat
#   run) needs root for unshare, mounts and chroot and does not drop to a user afterwards yet.
# right mount: unshare of the mount namespace, mounts and chroot of the compat runner
rights = ["mount"]
args = ["-m", "/data/ultar/agent/model.gguf", "--host", "127.0.0.1", "--port", "8080", "-c", "4096", "--parallel", "1"]
restart = "on-failure"
[cgroup]
"cpu.weight" = "60"
