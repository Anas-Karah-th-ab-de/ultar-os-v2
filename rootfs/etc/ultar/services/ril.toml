# Nur Handy-Ausgabe (Samsung-Hardware)
editions = ["phone"]
# Funkdienst: hält den Mobilfunk-Zustand (SIM, Netz, Zellen) für die Oberfläche aktuell
# (/run/ultar/radio/state) und führt Netzwahl-/PIN-Befehle aus. Wartet selbst, bis das Modem online ist.
exec = "/usr/bin/ultar-ril"
# Identity and rights (checked by ultar-init's shipped-file test):
# root: radio interface (phone): talks to the modem IPC device nodes and configures the mobile
#   data interface (addresses, routes); root-only on Linux. To be split like net.
# right net_admin: address and routes of the mobile data interface
rights = ["net_admin"]
# --bus: the modem is also served as `modem.*` for the call service (ultar-calld).
args = ["--daemon", "--bus", "/run/ultar/bus/ril.sock"]
after = ["bus"]
restart = "always"

[cgroup]
"memory.max" = "16M"
