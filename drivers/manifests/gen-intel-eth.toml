# Intel gigabit Ethernet (e1000e family). 8086:0d4c = I219-LM (11) of the ThinkPad P1 Gen 3.
id = "gen-intel-eth"
version = "1.0.0"
class = "net"
kernel_abi = ["ultar-kern-abi-1"]
origin = "workshop"
rank = 50
name_key = "driver.gen-intel-eth.name"
