[package]
name = "ultar-luks"
version = "0.8.3"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "LUKS2 data encryption of Ultar OS: writes and opens LUKS2 headers (Argon2id keyslot, AF split, PBKDF2 digest, aes-xts-plain64) with reviewed RustCrypto libraries only – cryptsetup reads what it writes"

[lib]
name = "ultar_luks"
path = "src/lib.rs"

[[bin]]
name = "ultar-luks"
path = "src/bin/ultar-luks.rs"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
xts-mode = "0.5"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"
ultar-hal-system = { path = "../../hal/ultar-hal-system" }
ultar-brand = { path = "../ultar-brand" }
