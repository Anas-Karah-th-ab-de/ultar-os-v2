# Rights of compositor clients by kernel user id (ultar-compositor --rights).
# Lines: <uid> = "ui.shell, ui.input-method, ui.lock-screen, ui.capture,
#                 ui.overlay, ui.system-dialog"
# Unknown ids get no right (default deny). Root (0) is refused unless the
# compositor runs with --allow-root (development only); every id may appear
# once.
#
# The desktop shell, the lock screen and the system dialogs run as their own
# users (docs/integration/desktop-shell.md); the on-screen keyboard (ultar-osk)
# runs as its own user with ui.input-method.
814 = "ui.lock-screen"
815 = "ui.system-dialog"
816 = "ui.shell"
# The on-screen keyboard (ultar-osk): shows the input panel and types into the focused
# text field only.
839 = "ui.input-method"
# The display service (user 817): sets the output arrangement and learns
# each display's identity and modes (docs/integration/display-account-services.md).
817 = "ui.output-config"
# Screenshot service: reads outputs for the shell's screenshot button.
825 = "ui.capture"
# Remote view source (ultar-screend): reads the screen for the viewer.
841 = "ui.capture"
# Device mesh (user 833): reads and offers the clipboard for other devices
# (docs/integration/mesh-clipboard.md). Never while the session is locked,
# never a confidential entry.
833 = "ui.clipboard-bridge"
