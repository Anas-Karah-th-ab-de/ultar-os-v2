[package]
name = "ultar-mesh"
version = "0.8.0"
edition = "2021"
license = "Proprietary"
authors = ["KM Code Craft <https://code-craft.tech>"]
description = "Device mesh of Ultar OS: the person's own devices find each other, are paired by a code and hand work, files and the clipboard over (system services, area 4)"

[lib]
name = "ultar_mesh"
path = "src/lib.rs"

[[bin]]
name = "ultar-mesh"
path = "src/bin/ultar-mesh.rs"

[dependencies]
ultar-bus = { path = "../../core/ultar-bus" }
ultar-service = { path = "../../core/ultar-service" }
ultar-svckit = { path = "../../core/ultar-svckit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
spake2 = "0.4"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
ultar-svckit = { path = "../../core/ultar-svckit", features = ["testkit"] }
