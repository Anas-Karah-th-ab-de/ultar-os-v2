# System update service (docs/SYSTEM-UPDATE.md, docs/integration/boot-ab.md):
# checks ultar.code-craft.tech (or a drive) for a signed release, downloads it,
# writes it into the slot that is not running and arms a counted trial start;
# after the restart it confirms the release once the health services answer,
# else the loader falls back to the old slot. Configuration, trust keys and
# who may install: /etc/ultar/update.conf (written by the image build).
editions = ["desktop", "phone", "server"]
exec = "/usr/bin/ultar-updated"
args = [
    "--config", "/etc/ultar/update.conf",
    "--socket", "/run/ultar/bus/updated.sock",
    "--log-socket", "/run/ultar/log/updated.sock",
]
# Identity and rights (checked by ultar-init's shipped-file test):
# root: writes the inactive A/B slot and the boot control (the kernel opens these raw nodes for root only)
# right raw_device: the partitions ULTAR-BOOTCTL, ultar-kernel-a/b, ultar-system-a/b
rights = ["raw_device"]
dirs = ["/data/ultar/update"]
notify = true
after = ["bus", "settingsd", "devd"]
restart = "always"

[cgroup]
"memory.max" = "96M"
"pids.max" = "16"
"cpu.weight" = "30"
