# Ultar Android-Kaefig – gehaertete LXC-Config (Vorlage; am Geraet per ultar-android.sh gefuellt).
# Ziel: strikt isoliert, Host bleibt sauber. Android erbt KEINE Rechte am echten System.

lxc.uts.name = ultar-android

# --- Namespaces: alles ausser user (USER_NS im A30-Kernel aus) ---
lxc.namespace.keep =
# erstellt eigene pid/net/mount/ipc/uts-Namespaces (Default von LXC); user-ns nicht moeglich.

# --- Rootfs: NUR Container-Images, KEIN Zugriff auf Ultars echtes / oder /data ---
lxc.rootfs.path = dir:/run/ultar/android/rootfs
# system.img (ro) + data.img (rw) werden von ultar-android.sh dorthin gemountet.
lxc.rootfs.managed = 0

# --- Capabilities droppen (nur das Noetige bleibt) ---
lxc.cap.drop = sys_module mac_admin mac_override sys_time sys_rawio sys_boot syslog
lxc.cap.drop = audit_control audit_write audit_read setfcap linux_immutable
lxc.cap.drop = wake_alarm block_suspend bpf perfmon

# --- seccomp: Syscall-Filter ---
lxc.seccomp.profile = /usr/lib/ultar/android/seccomp.txt

# --- Nur freigegebene Geraete (cgroup devices) ---
lxc.cgroup.devices.deny = a
lxc.cgroup.devices.allow = c 1:3 rwm    # null
lxc.cgroup.devices.allow = c 1:5 rwm    # zero
lxc.cgroup.devices.allow = c 1:9 rwm    # urandom
# Android-IPC (Major am Geraet pruefen -> ultar-android.sh traegt die echten ein):
# binder/hwbinder/vndbinder, ashmem, ion, mali0, exynos-codec(MFC). Display: SwiftShader (kein /dev/dri).

# --- Bind-Mounts: Austausch NUR ueber einen Ordner ---
lxc.mount.entry = /data/ultar/android-share data/ultar-share none bind,create=dir 0 0
# KEIN Bind von /data, /efs, /vendor-Secrets o.ae. in den Container.

# --- Netzwerk: eigenes IF, gefiltert (siehe Firewall in ultar-android.sh) ---
# veth im A30-Kernel aus -> ultar-android.sh richtet TUN+NAT ein (Default) ODER Host-Netz nur mit Firewall.
lxc.net.0.type = none
# "none" = ultar-android.sh verwaltet das Netz selbst (TUN) mit strengen iptables-Regeln.

lxc.pty.max = 1024
lxc.autodev = 1
