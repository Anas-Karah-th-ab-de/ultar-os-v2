# Log service (review block B). Starts first: every other service writes its
# records to its own socket here, and their loggers buffer (bounded) until
# this service is up, so nothing has to wait for it. ultar-init forwards the
# standard output and error of every service to the output socket.
#
# Runs as its own user (802) without kernel rights. Identity of a writer =
# the socket it reaches: each socket belongs to logd and is open to the
# writer's group only (mode 0660; logd is a member of those groups, which
# lets it hand the socket to them). On a kernel with SO_PEERCRED one socket
# is enough:
#   "--listen", "/run/ultar/log/ingest.sock", "--mode", "0666",
#   "--uid-map", "/etc/ultar/uid-map.toml"
#
# Ids of the system services: 801 busd, 802 logd, 803 settingsd, 804 devd,
# 805 launcher, 813 authd.
# 817 displayd, 818 accountd.
#
# Bounds (all enforced, see ultar-logd): 2048 records / 1 MiB in memory,
# 1 MiB per segment, 16 MiB on disk, 30 days, 200 records at once and
# 50 per second per source.
exec = "/usr/bin/ultar-logd"
args = [
    "--dir", "/data/ultar/log",
    "--listen", "/run/ultar/log/busd.sock=system.busd", "--mode", "0660", "--group", "801",
    "--listen", "/run/ultar/log/settingsd.sock=system.settingsd", "--mode", "0660", "--group", "803",
    "--listen", "/run/ultar/log/devd.sock=system.devd", "--mode", "0660", "--group", "804",
    "--listen", "/run/ultar/log/launcher.sock=system.launcher", "--mode", "0660", "--group", "805",
    "--listen", "/run/ultar/log/authd.sock=system.authd", "--mode", "0660", "--group", "813",
    # Standard output and error of the apps (stored as app-<id>), from the launcher.
    "--listen-output", "/run/ultar/log/launcher-out.sock", "--mode", "0660", "--group", "805",
    "--listen", "/run/ultar/log/displayd.sock=system.displayd", "--mode", "0660", "--group", "817",
    "--listen", "/run/ultar/log/accountd.sock=system.accountd", "--mode", "0660", "--group", "818",
    "--listen", "/run/ultar/log/powerd.sock=system.powerd", "--mode", "0660", "--group", "819",
    "--listen", "/run/ultar/log/sessiond.sock=system.sessiond", "--mode", "0660", "--group", "820",
    "--listen", "/run/ultar/log/notifyd.sock=system.notifyd", "--mode", "0660", "--group", "821",
    "--listen", "/run/ultar/log/calendard.sock=system.calendard", "--mode", "0660", "--group", "822",
    "--listen", "/run/ultar/log/audiod.sock=system.audiod", "--mode", "0660", "--group", "823",
    "--listen", "/run/ultar/log/mediad.sock=system.mediad", "--mode", "0660", "--group", "824",
    "--listen", "/run/ultar/log/captured.sock=system.captured", "--mode", "0660", "--group", "825",
    "--listen", "/run/ultar/log/netd.sock=system.netd", "--mode", "0660", "--group", "826",
    "--listen", "/run/ultar/log/btd.sock=system.btd", "--mode", "0660", "--group", "827",
    "--listen", "/run/ultar/log/volumed.sock=system.volumed", "--mode", "0660", "--group", "828",
    "--listen", "/run/ultar/log/mesh.sock=system.mesh", "--mode", "0660", "--group", "833",
    "--listen", "/run/ultar/log/agentd.sock=system.agentd", "--mode", "0660", "--group", "834",
    "--listen", "/run/ultar/log/voiced.sock=system.voiced", "--mode", "0660", "--group", "842",
    "--listen", "/run/ultar/log/llmbus.sock=system.llmbus", "--mode", "0660", "--group", "835",
    "--listen", "/run/ultar/log/llmcloud.sock=system.llmcloud", "--mode", "0660", "--group", "837",
    # The update service (root, group 841).
    "--listen", "/run/ultar/log/updated.sock=system.updated", "--mode", "0660", "--group", "841",
    # Standard output and error of the services, from ultar-init (root).
    "--listen-output", "/run/ultar/log/init.sock", "--mode", "0600",
    "--bus", "/run/ultar/bus/logd.sock",
    "--policy", "/etc/ultar/bus-policy.toml",
    "--kernel-log", "/proc/ultar/protokoll",
    "--segment-bytes", "1048576",
    "--total-bytes", "16777216",
    "--max-age-s", "2592000",
    "--fsync", "batch",
]
user = 802
groups = [801, 803, 804, 805, 813, 817, 818, 819, 820, 821, 822, 823, 824, 825, 826, 827, 828, 833, 834, 835, 837, 841, 842]
dirs = ["/data/ultar/log"]
public_dirs = ["/run/ultar/log"]
notify = true
restart = "always"


# Boot profiles: the ordinary system and the installation medium's session
# (ultar.profile=installer, set by the Ultar kernel on an installer medium).
[profiles]
system = "start"
installer = "start"

[cgroup]
"memory.max" = "48M"
"pids.max" = "160"
"cpu.weight" = "50"
